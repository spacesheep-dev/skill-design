<!DOCTYPE html>
<!--
  The direction switcher. Copy the <style>, the <nav> and the <script> into the design,
  and make each direction a <section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-<slug>"
  data-ss-thing="direction/<slug>" data-ss-label="<Name>"> (its label is its tab) and a data-line (one line under the tabs).
  - A link ending in #direction-<slug> opens that direction.
  - data-default on one section makes it the one the space opens on (after a pick).
  - In a working canvas the tabs stay pinned at screen size and select the direction.
  - Keep the desktop directions in one row: data-ss-y="0", with x spaced by width + 72.
  - Without the canvas meta, the client copy shows one direction at a time.
  - Printing the client copy shows only its selected direction.
  This file runs as it is: open it to see three demo directions.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction switcher</title>
<meta name="ss-canvas" content="on">
<style>
  /* switcher: start */
  .switcher { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #ddd;
    padding: 8px 12px 6px; font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111; }
  .switcher-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .switcher-tabs::-webkit-scrollbar { display: none; }
  .switcher-tabs button { flex: 0 0 auto; min-height: 44px; padding: 0 14px; border: 1px solid #ccc;
    border-radius: 22px; background: #fff; color: #111; font: inherit; cursor: pointer; }
  .switcher-tabs button[aria-selected="true"] { background: #111; color: #fff; border-color: #111; }
  .switcher-tabs button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  .switcher-line { margin: 6px 2px 0; font-size: 13px; color: #555; min-height: 1.3em; }
  .direction { display: none; }
  .direction.on { display: block; }
  html:has(meta[name="ss-canvas"][content="on"]) .direction { display: block; }
  /* switcher: end */

  /* demo only */
  body { margin: 0; }
  .demo { padding: 48px 20px; min-height: 60vh; }
  .demo h1 { margin: 0 0 12px; font-size: clamp(32px, 8vw, 56px); line-height: 1.05; }
  .d1 { background: #f4f5f7; color: #1f2a24; font-family: Georgia, serif; }
  .d2 { background: #14161c; color: #f4efe6; font-family: system-ui, sans-serif; }
  .d3 { background: #e8f0ec; color: #0f3d2e; font-family: "Trebuchet MS", sans-serif; }
</style>
</head>
<body>

<nav data-ss-canvas="pin" class="switcher no-print" aria-label="Design directions" data-ss-react="off">
  <div class="switcher-tabs" role="tablist"></div>
  <p class="switcher-line" aria-live="polite"></p>
</nav>

<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-harbour-chart" data-ss-x="0" data-ss-y="0" data-ss-thing="direction/harbour-chart" data-ss-label="Harbour Chart" data-line="Calm and plain; leads with the due date.">
  <div class="demo d1"><h1 data-ss-id="chart-headline">Never miss a mooring fee</h1><p data-ss-id="chart-intro">Demo direction one.</p></div>
</section>
<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-night-watch" data-ss-x="1352" data-ss-y="0" data-ss-thing="direction/night-watch" data-ss-label="Night Watch" data-line="Dark field and huge type; leads with the promise.">
  <div class="demo d2"><h1 data-ss-id="nightwatch-headline">Your fees, on watch</h1><p data-ss-id="nightwatch-intro">Demo direction two.</p></div>
</section>
<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-logbook" data-ss-x="2704" data-ss-y="0" data-ss-thing="direction/logbook" data-ss-label="Logbook" data-line="Editorial columns; leads with the price.">
  <div class="demo d3"><h1 data-ss-id="logbook-headline">£6 a month</h1><p data-ss-id="logbook-intro">Demo direction three.</p></div>
</section>

<script>
/* switcher: start */
(() => {
  const tabs = document.querySelector('.switcher-tabs');
  const line = document.querySelector('.switcher-line');
  if (!tabs) return;
  const all = () => [...document.querySelectorAll('section.direction')];
  const label = (d) => d.dataset.ssLabel || d.dataset.name || d.dataset.ssId || '';
  let cur = null;
  function fromHash() {
    const dirs = all();
    let id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch {}
    return dirs.find((d) => d.dataset.ssId === id)
      || dirs.find((d) => d.contains(document.getElementById(id) || document.querySelector('[data-ss-id="' + CSS.escape(id) + '"]')))
      || dirs.find((d) => d.hasAttribute('data-default'))
      || dirs[0];
  }
  function show(d) {
    if (!d) return;
    cur = d;
    all().forEach((x, i) => {
      x.classList.toggle('on', x === d);
      if (tabs.children[i]) tabs.children[i].setAttribute('aria-selected', String(x === d));
    });
    line.textContent = d.dataset.line || '';
  }
  function draw() {
    try { tabs.replaceChildren(...all().map((d) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.textContent = label(d);
      b.addEventListener('click', () => { history.replaceState(null, '', '#' + d.dataset.ssId); show(d); dispatchEvent(new HashChangeEvent('hashchange')); });
      return b;
    }));
    show(fromHash()); } finally { watch.takeRecords(); } // its own changes mustn't call it again
  }
  // A live push redraws the page from its source, where the tabs are empty: draw them again.
  const stale = () => {
    const dirs = all();
    return tabs.children.length !== dirs.length || dirs.some((d, i) => tabs.children[i].textContent !== label(d))
      || !document.contains(cur) || line.textContent !== (cur.dataset.line || '');
  };
  const watch = new MutationObserver(() => { if (stale()) draw(); });
  watch.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-ss-label', 'data-name', 'data-line', 'data-ss-id'] });
  addEventListener('hashchange', () => show(fromHash()));
  draw();
  if (cur && !location.hash && cur.hasAttribute('data-default') && document.querySelector('meta[name="ss-canvas"][content="on"]')) {
    history.replaceState(null, '', '#' + cur.dataset.ssId);
  }
})();
/* switcher: end */
</script>
</body>
</html>
