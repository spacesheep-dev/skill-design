<!DOCTYPE html>
<!--
  The direction switcher. Copy the <style>, the <nav> and the <script> into the design,
  and make each direction a <section class="direction" data-ss-section data-ss-id="direction-<slug>"
  data-ss-thing="direction/<slug>" data-ss-label="<Name>"> with a data-name (shown on its tab) and a data-line (one line under the tabs).
  - A link ending in #direction-<slug> opens that direction.
  - data-default on one section makes it the one the space opens on (after a pick).
  - Printing shows only the direction on screen.
  This file runs as it is: open it to see three demo directions.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction switcher</title>
<style>
  /* switcher: start */
  .switcher { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #ddd;
    padding: 8px 12px 6px; font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111; }
  .switcher-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .switcher-tabs::-webkit-scrollbar { display: none; }
  .switcher-tabs button { flex: 0 0 auto; min-height: 44px; padding: 0 14px; border: 1px solid #ccc;
    border-radius: 22px; background: #fff; color: #111; font: inherit; cursor: pointer; }
  .switcher-tabs button[aria-selected="true"] { background: #111; color: #fff; border-color: #111; }
  .switcher-tabs button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  .switcher-line { margin: 6px 2px 0; font-size: 13px; color: #555; min-height: 1.3em; }
  .direction { display: none; }
  .direction.on { display: block; }
  /* switcher: end */

  /* demo only */
  body { margin: 0; }
  .demo { padding: 48px 20px; min-height: 60vh; }
  .demo h1 { margin: 0 0 12px; font-size: clamp(32px, 8vw, 56px); line-height: 1.05; }
  .d1 { background: #f4f5f7; color: #1f2a24; font-family: Georgia, serif; }
  .d2 { background: #14161c; color: #f4efe6; font-family: system-ui, sans-serif; }
  .d3 { background: #e8f0ec; color: #0f3d2e; font-family: "Trebuchet MS", sans-serif; }
</style>
</head>
<body>

<nav class="switcher no-print" aria-label="Design directions" data-ss-react="off">
  <div class="switcher-tabs" role="tablist"></div>
  <p class="switcher-line" aria-live="polite"></p>
</nav>

<section class="direction" data-ss-section data-ss-id="direction-harbour-chart" data-ss-thing="direction/harbour-chart" data-ss-label="Harbour Chart" data-name="Harbour Chart" data-line="Calm and plain; leads with the due date.">
  <div class="demo d1"><h1 data-ss-id="chart-headline">Never miss a mooring fee</h1><p data-ss-id="chart-intro">Demo direction one.</p></div>
</section>
<section class="direction" data-ss-section data-ss-id="direction-night-watch" data-ss-thing="direction/night-watch" data-ss-label="Night Watch" data-name="Night Watch" data-line="Dark field and huge type; leads with the promise.">
  <div class="demo d2"><h1 data-ss-id="nightwatch-headline">Your fees, on watch</h1><p data-ss-id="nightwatch-intro">Demo direction two.</p></div>
</section>
<section class="direction" data-ss-section data-ss-id="direction-logbook" data-ss-thing="direction/logbook" data-ss-label="Logbook" data-name="Logbook" data-line="Editorial columns; leads with the price.">
  <div class="demo d3"><h1 data-ss-id="logbook-headline">£6 a month</h1><p data-ss-id="logbook-intro">Demo direction three.</p></div>
</section>

<script>
/* switcher: start */
(() => {
  const dirs = [...document.querySelectorAll('section.direction')];
  const tabs = document.querySelector('.switcher-tabs');
  const line = document.querySelector('.switcher-line');
  if (!dirs.length || !tabs) return;
  const buttons = dirs.map((d) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.textContent = d.dataset.name || d.dataset.ssId;
    b.addEventListener('click', () => { history.replaceState(null, '', '#' + d.dataset.ssId); show(d); });
    tabs.appendChild(b);
    return b;
  });
  function show(d) {
    dirs.forEach((x, i) => {
      const on = x === d;
      x.classList.toggle('on', on);
      buttons[i].setAttribute('aria-selected', String(on));
    });
    line.textContent = d.dataset.line || '';
  }
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    return dirs.find((d) => d.dataset.ssId === id)
      || dirs.find((d) => d.contains(document.getElementById(id) || document.querySelector('[data-ss-id="' + CSS.escape(id) + '"]')))
      || dirs.find((d) => d.hasAttribute('data-default'))
      || dirs[0];
  }
  addEventListener('hashchange', () => show(fromHash()));
  show(fromHash());
})();
/* switcher: end */
</script>
</body>
</html>
