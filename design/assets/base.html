<!DOCTYPE html>
<!--
  The starter page: copy it to index.html.
  1. Set the title, and in one edit the block from the directions' tokens to the last section: each direction's
     slug (direction-slug, its blocks slug-part), data-ss-label (its name), data-line and tokens.
  2. Push it: that is the frame. Then assets/fold.js draws each direction in parts, between its
     part:slug markers, in place of its .drawing block. Keep the markers, renamed with the slug.
  One design, not directions: keep one section, and drop the switcher's nav and script.
  Keep the metas, the switcher and the ids.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design title</title>
<meta name="ss-chat" content="open">
<meta name="ss-workspace" content="design">
<meta name="ss-canvas" content="on">
<style>
  /* switcher: start */
  .switcher { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #ddd;
    padding: 8px 12px 6px; font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111; }
  .switcher-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .switcher-tabs::-webkit-scrollbar { display: none; }
  .switcher-tabs button { flex: 0 0 auto; min-height: 44px; padding: 0 14px; border: 1px solid #ccc;
    border-radius: 22px; background: #fff; color: #111; font: inherit; cursor: pointer; }
  .switcher-tabs button[aria-selected="true"] { background: #111; color: #fff; border-color: #111; }
  .switcher-tabs button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  .switcher-line { margin: 6px 2px 0; font-size: 13px; color: #555; min-height: 1.3em; }
  html:not(:has(meta[name="ss-canvas"][content="on"])) .direction:not(.on) { display: none; }
  /* switcher: end */

  /* shared: what every direction uses */
  :root { --space: 8px; --radius: 6px; --step-0: 16px; --step-1: 20px; --step-2: 25px; --step-3: 31px; --step-4: 39px; --step-5: 49px;
    --ease: cubic-bezier(.2,.7,.2,1); --dur: 240ms; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; overflow-wrap: break-word; }
  img, svg { max-width: 100%; height: auto; }
  h1, h2, h3 { text-wrap: balance; } p { text-wrap: pretty; }
  :focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
  .direction { background: var(--brand-ground); color: var(--brand-ink); font: var(--step-0)/1.6 var(--font-body); min-height: 70vh; }

  /* phone guard: rows wrap and stack, so nothing scrolls sideways or runs past an edge at 390 px */
  :where(.direction *) { min-width: 0; }
  :where(.direction) :where(pre, code, kbd, samp) { white-space: pre-wrap; overflow-wrap: anywhere; }

  /* the kit: finished parts a direction composes and restyles through its tokens.
     Colour comes in pairs, a surface and the text on it: ground/ink, ground/muted, surface/on-surface,
     surface/muted, accent/on-accent, and accent as text on ground. Shape and rhythm: --radius, --density,
     --rule, --shadow, --label-case, --label-track, --display-weight, --measure. Looks sit in :where(),
     so a direction's own CSS wins; the guards (wrapping, no stray cell, fields that fit) hold. */
  :where(.direction) {
    --brand-surface: color-mix(in srgb, var(--brand-ink) 6%, var(--brand-ground));
    --brand-on-surface: var(--brand-ink);
    --brand-muted: color-mix(in srgb, var(--brand-ink) 74%, var(--brand-ground));
    --brand-on-accent: var(--brand-ground);
    --density: 1; --rule: 1px; --shadow: none; --label-case: none; --label-track: 0; --display-weight: 650; --measure: 62ch;
    --s1: calc(4px * var(--density)); --s2: calc(8px * var(--density)); --s3: calc(16px * var(--density));
    --s4: calc(24px * var(--density)); --s5: calc(40px * var(--density)); --s6: calc(64px * var(--density));
    --step--1: 13px; --line: color-mix(in srgb, currentColor 16%, transparent);
  }
  :where(.direction) :where(h1, h2, h3, h4) { font-family: var(--font-display); font-weight: var(--display-weight); line-height: 1.15; }
  :where(.direction) :where(a) { color: var(--brand-accent); }
  .k-label { text-transform: var(--label-case); letter-spacing: var(--label-track); font-size: var(--step--1); font-weight: 600; color: var(--brand-muted); }

  /* top bar: logo, nav and a way back; wraps instead of crowding */
  .k-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); }
  :where(.k-bar) { padding: var(--s3) var(--s4); border-bottom: var(--rule) solid var(--line); }
  .k-bar :where(nav, ul) { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); margin: 0; padding: 0; list-style: none; }
  :where(.k-bar) :where(a) { color: inherit; text-decoration: none; }
  :where(.k-bar) :where([aria-current]) { color: var(--brand-accent); font-weight: 600; }
  .k-bar :where(.k-back) { margin-left: auto; }

  /* hero: a headline that wraps evenly, a line held to a readable width, and its actions */
  :where(.k-hero) { padding: var(--s6) var(--s4) var(--s5); }
  :where(.k-hero) :where(h1, h2) { margin: 0 0 var(--s3); font-size: clamp(var(--step-3), 5vw, var(--step-5)); line-height: 1.05; }
  .k-hero :where(h1, h2) { max-width: 22ch; text-wrap: balance; }
  .k-hero :where(p) { max-width: var(--measure); }
  :where(.k-hero) :where(p) { margin: 0 0 var(--s4); font-size: var(--step-1); }
  .k-actions { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }

  /* cards: every card the same width; a short last row sits centred, and only a card that would be
     alone on it takes the whole row (the column count is picked so that is rare) */
  .k-cards, .cards { --k-cols: 3; display: flex; flex-wrap: wrap; justify-content: center; gap: var(--s3); margin: 0; padding: 0; list-style: none; }
  .k-cards > *, .cards > * { flex: 0 1 calc((100% - (var(--k-cols) - 1) * var(--s3)) / var(--k-cols)); }
  :is(.k-cards, .cards) > :last-child:nth-child(3n+1):not(:nth-child(4), :nth-child(7), :nth-child(10), :nth-child(13)) { flex-grow: 1; }
  :is(.k-cards, .cards):has(> :nth-child(2):last-child) { --k-cols: 2; }
  :is(.k-cards, .cards):has(> :nth-child(4):last-child, > :nth-child(7):last-child, > :nth-child(8):last-child,
    > :nth-child(10):last-child, > :nth-child(11):last-child, > :nth-child(12):last-child) { --k-cols: 4; }
  :is(.k-cards, .cards):has(> :nth-child(13):last-child) { --k-cols: 5; }
  @media (max-width: 40rem) { .k-cards, .cards { --k-cols: 1; } }
  :where(.k-card) { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s3); background: var(--brand-surface); color: var(--brand-on-surface);
    border: var(--rule) solid color-mix(in srgb, var(--brand-on-surface) 14%, transparent); border-radius: var(--radius); box-shadow: var(--shadow); }
  :where(.k-card) :where(h3, h4) { margin: 0; font-size: var(--step-1); }
  :where(.k-card) :where(p) { margin: 0; }
  :where(.k-card .k-meta, .k-meta) { color: var(--brand-muted); font-size: var(--step--1); }
  :where(.k-card) :where(.k-actions) { margin-top: auto; padding-top: var(--s2); }
  :where(a.k-card) { text-decoration: none; transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease); }
  :where(a.k-card:hover) { border-color: var(--brand-accent); }

  /* table: a real table on a wide screen, labelled rows on a phone (each cell needs data-label) */
  .k-table, .stack { width: 100%; border-collapse: collapse; }
  :where(.k-table, .stack) :where(th, td) { padding: var(--s2) var(--s2); text-align: left; border-bottom: var(--rule) solid var(--line); vertical-align: top; }
  :where(.k-table, .stack) :where(th) { font-size: var(--step--1); font-weight: 600; color: var(--brand-muted); text-transform: var(--label-case); letter-spacing: var(--label-track); }
  :is(.k-table, .stack) :is(th, td).num { text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 40rem) {
    :is(.k-table, .stack), :is(.k-table, .stack) tbody, :is(.k-table, .stack) tr { display: block; }
    :is(.k-table, .stack) thead { display: none; }
    :is(.k-table, .stack) tr { padding: var(--space) 0; border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
    :is(.k-table, .stack) td { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: calc(var(--space) * 2); padding: 2px 0; text-align: right; border: 0; }
    :is(.k-table, .stack) td::before { content: attr(data-label); text-align: left; opacity: .75; }
    :is(.k-table, .stack) td:first-child { display: block; text-align: left; font-weight: 600; }
    :is(.k-table, .stack) td:first-child::before { content: none; }
  }

  /* stat row: even columns, two by two on a phone */
  .k-stats { --k-cols: 4; display: grid; grid-template-columns: repeat(var(--k-cols), minmax(0, 1fr)); gap: var(--s3); margin: 0; padding: 0; list-style: none; }
  .k-stats:has(> :nth-child(3):last-child) { --k-cols: 3; } .k-stats:has(> :nth-child(2):last-child) { --k-cols: 2; }
  @media (max-width: 40rem) { .k-stats { --k-cols: 2; } .k-stats:has(> :nth-child(3):last-child) > :last-child { grid-column: 1 / -1; } }
  /* density sets the size and the room: a tight direction's figures are small and close, a roomy one's large and open */
  :where(.k-stat) { display: grid; gap: var(--s1); padding-top: var(--s3); border-top: var(--rule) solid var(--line); }
  :where(.k-stat) :where(b, strong) { display: block; font: var(--display-weight) clamp(var(--step-2), calc(var(--step-3) + (var(--density) - 1) * 32px), var(--step-5))/1.05 var(--font-display); font-variant-numeric: tabular-nums; }
  :where(.k-stat) :where(span) { color: var(--brand-muted); font-size: var(--step--1); text-transform: var(--label-case); letter-spacing: var(--label-track); }

  /* chips and tags: wrap, never clip */
  .k-chips { display: flex; flex-wrap: wrap; gap: var(--s1); margin: 0; padding: 0; list-style: none; }
  .k-chip { display: inline-flex; align-items: center; max-width: 100%; overflow-wrap: anywhere; }
  :where(.k-chip) { min-height: 32px; padding: 2px var(--s2); border: var(--rule) solid color-mix(in srgb, currentColor 28%, transparent); border-radius: 999px;
    background: transparent; color: inherit; font: 500 var(--step--1)/1.3 var(--font-body); }
  :where(button.k-chip) { cursor: pointer; }
  :where(.k-chip[aria-pressed="true"], .k-chip.on) { background: var(--brand-accent); border-color: var(--brand-accent); color: var(--brand-on-accent); }

  /* buttons: primary, line and quiet; 44 px to tap */
  .k-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); min-height: 44px; max-width: 100%; text-align: center; }
  :where(.k-btn) { padding: 0 var(--s3); border: var(--rule) solid var(--brand-accent); border-radius: var(--radius); background: var(--brand-accent);
    color: var(--brand-on-accent); font: 600 var(--step-0)/1.2 var(--font-body); text-decoration: none; cursor: pointer;
    transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease); }
  :where(.k-btn:hover) { background: color-mix(in srgb, var(--brand-accent) 86%, var(--brand-ink)); }
  :where(.k-btn.line) { background: transparent; color: var(--brand-accent); }
  :where(.k-btn.line:hover) { background: color-mix(in srgb, var(--brand-accent) 10%, transparent); }
  :where(.k-btn.quiet) { background: transparent; border-color: transparent; color: var(--brand-ink); text-decoration: underline; text-underline-offset: 3px; }
  :where(.k-btn, .k-chip, .k-tabs [role="tab"]):focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }
  :where(.k-btn, .k-chip):is(:disabled, [aria-disabled="true"]) { opacity: .45; cursor: not-allowed; }

  /* search: a labelled field; the placeholder is a hint of at most 20 characters, the label says the rest */
  .k-search { display: flex; flex-direction: column; gap: var(--s1); width: 100%; max-width: 40rem; }
  .k-search :where(input, select) { width: 100%; min-width: 0; min-height: 44px; }
  :where(.k-search) :where(label) { font-weight: 600; font-size: var(--step--1); }
  :where(.k-search) :where(input, select) { padding: 0 var(--s2); border: var(--rule) solid color-mix(in srgb, currentColor 36%, transparent);
    border-radius: var(--radius); background: var(--brand-surface); color: var(--brand-on-surface); font: inherit; }
  :where(.k-search) :where(input)::placeholder { color: var(--brand-muted); opacity: 1; }

  /* tabs wrap; filters fold behind one button on a phone */
  .k-tabs { display: flex; flex-wrap: wrap; gap: var(--s1); }
  :where(.k-tabs) { border-bottom: var(--rule) solid var(--line); }
  :where(.k-tabs) :where([role="tab"]) { min-height: 44px; padding: 0 var(--s2); border: 0; border-bottom: 3px solid transparent; margin-bottom: calc(-1 * var(--rule));
    background: none; color: inherit; font: inherit; cursor: pointer; }
  :where(.k-tabs) :where([role="tab"][aria-selected="true"]) { border-bottom-color: var(--brand-accent); font-weight: 600; }
  .k-filters { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: end; }
  .k-filters > .k-filters-toggle { display: none; }
  @media (max-width: 40rem) {
    .k-filters > .k-filters-toggle { display: inline-flex; }
    .k-filters:not([data-open]) > :not(.k-filters-toggle) { display: none; }
    .k-filters > * { flex: 1 1 100%; }
  }

  /* steps: where you are, how much is left, a step that can wait */
  .k-steps { display: flex; flex-wrap: wrap; gap: var(--s2); margin: 0; padding: 0; list-style: none; counter-reset: k-step; }
  .k-steps > li { flex: 1 1 calc(8rem * var(--density)); display: flex; align-items: center; gap: var(--s2); }
  /* density sets the label size, the marker and the room above it, as on the stat row */
  :where(.k-steps > li) { counter-increment: k-step; padding-top: var(--s3); border-top: calc(2px + var(--rule)) solid var(--line); color: var(--brand-muted);
    font-size: clamp(var(--step--1), calc(var(--step-0) + (var(--density) - 1) * 12px), var(--step-1)); line-height: 1.3; }
  :where(.k-steps > li)::before { content: counter(k-step); display: inline-grid; place-items: center; flex: 0 0 auto; width: calc(12px + 16px * var(--density)); aspect-ratio: 1; border-radius: 50%;
    border: var(--rule) solid currentColor; font: 600 var(--step--1)/1 var(--font-body); }
  :where(.k-steps > li[data-state="done"]) { color: var(--brand-ink); border-top-color: var(--brand-accent); }
  :where(.k-steps > li[data-state="done"])::before { content: "✓"; background: var(--brand-accent); border-color: var(--brand-accent); color: var(--brand-on-accent); }
  :where(.k-steps > li[aria-current="step"]) { color: var(--brand-ink); font-weight: 600; border-top-color: var(--brand-accent); }
  :where(.k-steps > li[aria-current="step"])::before { border-width: 2px; border-color: var(--brand-accent); }
  :where(.k-steps > li[data-state="skipped"]) { font-style: italic; }
  .k-steps-count { font-size: var(--step--1); color: var(--brand-muted); }
  @media (max-width: 40rem) {
    .k-steps > li:not([aria-current="step"]) { flex: 0 0 auto; font-size: 0; gap: 0; }
    .k-steps > li:not([aria-current="step"])::before { font-size: var(--step--1); }
    .k-steps > li[aria-current="step"] { flex: 1 1 100%; order: -1; }
  }

  /* empty: the one way to say "nothing here yet", with one way forward */
  .k-empty { display: grid; justify-items: center; text-align: center; gap: var(--s2); }
  :where(.k-empty) { padding: var(--s6) var(--s3); border: var(--rule) dashed color-mix(in srgb, currentColor 30%, transparent); border-radius: var(--radius); color: var(--brand-muted); }
  :where(.k-empty) :where(h3, h4) { margin: 0; color: var(--brand-ink); }
  :where(.k-empty) :where(p) { margin: 0; max-width: 40ch; }

  /* being drawn: replaced by the direction itself */
  .drawing { padding: calc(var(--space) * 6) calc(var(--space) * 3); }
  .drawing h2 { margin: 0 0 var(--space); font: 600 var(--step-4)/1.1 var(--font-display); }
  .drawing p { margin: 0 0 calc(var(--space) * 4); opacity: .8; }
  .drawing i { display: block; height: 14px; margin: 0 0 12px; border-radius: 7px; background: currentColor; opacity: .12;
    animation: drawing 1.4s var(--ease) infinite alternate; }
  .drawing i:nth-of-type(2) { width: 80%; } .drawing i:nth-of-type(3) { width: 55%; }
  @keyframes drawing { to { opacity: .28; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<nav data-ss-canvas="pin" class="switcher no-print" aria-label="Design directions" data-ss-react="off">
  <div class="switcher-tabs" role="tablist"></div>
  <p class="switcher-line" aria-live="polite"></p>
</nav>

<style>
  /* each direction: its own tokens. Set them, and each section's slug, name and line below, in one edit */
  [data-ss-id="direction-first"]  { --brand-ink: #1d2320; --brand-ground: #f3f5f2; --brand-accent: #1f6f50;
    --font-display: "Iowan Old Style", Palatino, Georgia, serif; --font-body: "Avenir Next", "Segoe UI", sans-serif; }
  [data-ss-id="direction-second"] { --brand-ink: #f2efe8; --brand-ground: #15171c; --brand-accent: #ffb703;
    --font-display: "Avenir Next", Futura, "Gill Sans", sans-serif; --font-body: "Avenir Next", "Segoe UI", sans-serif; }
  [data-ss-id="direction-third"]  { --brand-ink: #10242e; --brand-ground: #e6eef2; --brand-accent: #b4380a;
    --font-display: ui-monospace, Menlo, monospace; --font-body: Charter, "Iowan Old Style", Georgia, serif; }
</style>

<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-first" data-ss-thing="direction/first" data-ss-label="First" data-line="One line on what it leads with." data-ss-x="0" data-ss-y="0">
  <!-- part:first --><div class="drawing" data-ss-id="first-drawing"><h2>First</h2><p>Being drawn…</p><i></i><i></i><i></i></div><!-- /part:first -->
</section>

<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-second" data-ss-thing="direction/second" data-ss-label="Second" data-line="One line on what it leads with." data-ss-x="1352" data-ss-y="0">
  <!-- part:second --><div class="drawing" data-ss-id="second-drawing"><h2>Second</h2><p>Being drawn…</p><i></i><i></i><i></i></div><!-- /part:second -->
</section>

<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-third" data-ss-thing="direction/third" data-ss-label="Third" data-line="One line on what it leads with." data-ss-x="2704" data-ss-y="0">
  <!-- part:third --><div class="drawing" data-ss-id="third-drawing"><h2>Third</h2><p>Being drawn…</p><i></i><i></i><i></i></div><!-- /part:third -->
</section>

<script>
/* switcher: start */
(() => {
  const tabsNow = () => document.querySelector('.switcher-tabs');
  const lineNow = () => document.querySelector('.switcher-line');
  if (!tabsNow()) return;
  const all = () => [...document.querySelectorAll('section.direction')];
  const label = (d) => d.dataset.ssLabel || d.dataset.name || d.dataset.ssId || '';
  const hashOf = (d) => '#' + encodeURIComponent(d.dataset.ssId); // fromHash decodes it
  let cur = null, drawn = null;
  function fromHash() {
    const dirs = all();
    let id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch {}
    return dirs.find((d) => d.dataset.ssId === id)
      || dirs.find((d) => d.contains(document.getElementById(id) || document.querySelector('[data-ss-id="' + CSS.escape(id) + '"]')))
      || dirs.find((d) => d.hasAttribute('data-default'))
      || dirs[0];
  }
  function show(d) {
    if (!d) return;
    cur = d;
    const tabs = tabsNow(), line = lineNow();
    all().forEach((x, i) => {
      x.classList.toggle('on', x === d);
      if (tabs && tabs.children[i]) tabs.children[i].setAttribute('aria-selected', String(x === d));
    });
    if (line) line.textContent = d.dataset.line || '';
  }
  function draw() {
    try { drawn = tabsNow(); if (drawn) drawn.replaceChildren(...all().map((d) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.textContent = label(d);
      b.addEventListener('click', () => { history.replaceState(null, '', hashOf(d)); show(d); dispatchEvent(new HashChangeEvent('hashchange')); });
      return b;
    }));
    show(fromHash()); } finally { watch.takeRecords(); } // its own changes mustn't call it again
  }
  // A live push redraws the page from its source, where the tabs are empty, and on a canvas page it puts
  // fresh copies of the tabs and line in place of these: draw them again, into the ones on the page now.
  const stale = () => {
    const dirs = all(), tabs = tabsNow(), line = lineNow();
    return tabs !== drawn || (tabs && (tabs.children.length !== dirs.length || dirs.some((d, i) => tabs.children[i].textContent !== label(d))))
      || !document.contains(cur) || (line && line.textContent !== (cur.dataset.line || ''));
  };
  const watch = new MutationObserver(() => { if (stale()) draw(); });
  watch.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-ss-label', 'data-name', 'data-line', 'data-ss-id'] });
  addEventListener('hashchange', () => show(fromHash()));
  draw();
  if (cur && !location.hash && cur.hasAttribute('data-default') && document.querySelector('meta[name="ss-canvas"][content="on"]')) {
    history.replaceState(null, '', hashOf(cur));
  }
})();
/* switcher: end */
/* kit: the filters' fold button on a phone */
document.addEventListener('click', (e) => {
  const b = e.target.closest('.k-filters-toggle');
  if (!b) return;
  const f = b.closest('.k-filters');
  f.toggleAttribute('data-open');
  b.setAttribute('aria-expanded', String(f.hasAttribute('data-open')));
});
/* check: only when the address has ?ss-check (the save's pictures), never in a person's view. Once the page
   has loaded, it measures each direction at this width for what a picture can't be trusted to show:
     narrow  words in a column so thin they run under 4 characters a line
     wide    words or a control running past the direction's edge
     cut     words drawn outside a box that hides or scrolls its overflow, past its sides or its top or bottom
             (up and down, a glyph may overhang its line by a third of the font size: tight display type)
   It outlines each in red and asks for ss-fault/<slug>/<kind>/<element>.png, which doesn't exist: the
   picture's answer lists that request, and fold.js prints it as a fault. First the canvas goes off and
   every direction shows, full width and unscaled, as a person sees it on its own. */
if (/[?&]ss-check\b/.test(location.search)) {
  const canvas = document.querySelector('meta[name="ss-canvas"]');
  if (canvas) canvas.content = 'off';
  document.head.append(Object.assign(document.createElement('style'), { textContent: 'section.direction { display: block !important; } .switcher { display: none !important; }' }));
}
if (/[?&]ss-check\b/.test(location.search)) addEventListener('load', () => (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  const own = (v) => v && !/^auto-/.test(v) ? v : ''; // the renderer gives unnamed blocks auto- ids
  const name = (e) => e.tagName.toLowerCase() + (own(e.dataset.ssId) ? `[data-ss-id=${e.dataset.ssId}]` : e.id ? `#${e.id}` : e.classList.length ? `.${[...e.classList].slice(0, 2).join('.')}` : '');
  const shown = (e) => { for (let x = e; x; x = x.parentElement) { const s = getComputedStyle(x); if (s.display === 'none' || s.visibility === 'hidden') return false; } return true; };
  const skip = 'script, style, template, svg, [hidden], [aria-hidden=true]';
  for (const sec of document.querySelectorAll('section.direction')) {
    const slug = (sec.dataset.ssId || '').replace(/^direction-/, '');
    const box = sec.getBoundingClientRect();
    if (!box.width || !shown(sec)) continue;
    const k = box.width / (sec.offsetWidth || box.width); // a canvas may scale the direction
    const seen = new Set();
    const fault = (kind, el, text) => {
      const key = kind + name(el);
      if (seen.has(key) || seen.size >= 8) return;
      seen.add(key);
      el.style.outline = '3px solid #e00';
      const i = new Image();
      i.src = `ss-fault/${slug}/${kind}/${encodeURIComponent(name(el))}.png?t=${encodeURIComponent(text.replace(/\s+/g, ' ').trim().slice(0, 40))}`;
    };
    const lines = (n) => { const g = document.createRange(); g.selectNodeContents(n); return [...g.getClientRects()].filter((x) => x.width > 0); };
    const walk = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT);
    for (let n; (n = walk.nextNode()); ) {
      const t = n.textContent.replace(/\s+/g, ' ').trim(), el = n.parentElement;
      if (t.length < 12 || !el || el.closest(skip) || !shown(el)) continue;
      const tops = new Set(lines(n).map((x) => Math.round(x.top / k / 4)));
      if (tops.size >= 4 && t.length / tops.size < 4) fault('narrow', el, t);
    }
    const past = (q) => (q.right - box.right) / k > 2 || (box.left - q.left) / k > 2;
    const inside = (q) => q.right > box.left + 1 && q.left < box.right - 1;
    for (const el of sec.querySelectorAll('*')) {
      if (el.closest(skip) || !shown(el)) continue;
      const words = [...el.childNodes].filter((n) => n.nodeType === 3 && n.textContent.trim()), control = el.matches('a, button, input, select, textarea, label');
      if (!words.length && !control) continue; // decoration may bleed off an edge
      const r = el.getBoundingClientRect();
      if (r.width <= 1 || r.height <= 1 || getComputedStyle(el).position === 'fixed') continue; // visually hidden, or pinned
      const spans = words.flatMap(lines), reach = spans.concat(control || !spans.length ? [r] : []);
      const over = parseFloat(getComputedStyle(el).fontSize) / 3 || 0;
      for (let x = el; x && x !== sec; x = x.parentElement) {
        const o = getComputedStyle(x);
        if (o.overflowX === 'visible' && o.overflowY === 'visible') continue;
        const c = x.getBoundingClientRect();
        const side = o.overflowX !== 'visible' && spans.some((q) => (q.right - c.right) / k > 2 || (c.left - q.left) / k > 2);
        const end = o.overflowY !== 'visible' && spans.some((q) => (q.bottom - c.bottom) / k > Math.max(2, over) || (c.top - q.top) / k > Math.max(2, over));
        if (side || end) fault('cut', el, el.textContent);
        break;
      }
      if (reach.some(inside) && reach.some(past)) fault('wide', el, el.textContent);
    }
  }
}));
</script>
</body>
</html>
