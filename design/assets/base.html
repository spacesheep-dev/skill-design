<!DOCTYPE html>
<!--
  The starter page: copy it to index.html.
  1. Set the title, the directions' tokens and each section's opening tag, one Edit each: each direction's
     slug (direction-slug, its blocks slug-part), data-ss-label (its name), data-line and tokens.
  2. Push it: that is the frame. Then assets/fold.js draws each direction in parts, between its
     part:slug markers, in place of its .drawing block. Leave the markers: fold.js names them after the slug.
  One design, not directions: keep one section, and drop the switcher's tabs; keep its script (it shows the
  design, and its views' buttons) and the nav, which holds Export (and Tweaks, with controls).
  Keep the end mark, the comment that says design: end, last in the body: what Spacesheep adds comes after it.
  Keep the metas, the switcher (the frame: Back, the tabs and Tweaks), the canvas area (the
  <div data-ss-canvas-area> that holds every direction, view and round, under the bar) and the ids. The person's answers, when you asked: references/questions.md.
  A direction's phone or tablet view is a section of its own after the last direction, with data-view-of:
  SKILL.md, section 2.
  Each direction's about block (its intro, spec row and frames' captions) is an aside at the start of the canvas
  area, above its direction: its words are its part:slug-about, written last (references/directions.md, About blocks).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design title</title>
<meta name="ss-chat" content="open">
<meta name="ss-canvas-focus" content="all">
<style>
  /* switcher: start */
  /* the bar follows light or dark, as Spacesheep's canvas ground does; each direction keeps its own look */
  :root { color-scheme: light dark; } .direction { color-scheme: light; }
  :root { --bar-bg: #fff; --bar-ink: #111; --bar-line: #ccc; --bar-muted: #555; }
  @media (prefers-color-scheme: dark) { :root { --bar-bg: #1d1d22; --bar-ink: #f1f1f4; --bar-line: #45454f; --bar-muted: #a6a6b0; } }
  /* keys: every button on the bar is Spacesheep's button atom (assets/components/button.ts in the app, with the
     --ss-btn-* values of its theme), at its small size, 28 px (a touch screen reaches it from 44). A space can't load the app's styles, so
     the values are copied here, light and dark: change them with the app's. A key is a face, a 1px edge and a lip along
     its foot. Hover darkens the edge, a press sinks it a pixel, and a selected one (the open tab, an open
     Export, a device view, the chosen Use this) stays pressed in. Use this and Keep these are the primary, the one thing
     to press; every other is secondary. Rules set a key's --k-* slots, never its paint, so a state never has to outrank
     a kind. A hidden key is left to the browser's own [hidden] rule. */
  :root { --k-focus: light-dark(#5a5ae6, #b39dff); }
  .switcher { --k-face: light-dark(#fff, #2c313d); --k-face-hv: light-dark(#fff, #323845); --k-edge: light-dark(#d0cdc8, #454d5d);
    --k-edge-hv: light-dark(#b8b4ad, #636d82); --k-base: light-dark(#bfbbb4, #3d4453); --k-lip: light-dark(#e5e3de, #1e222a);
    --k-lip-hv: light-dark(#dedbd5, #232731); --k-hi: light-dark(transparent, rgba(255,255,255,.06)); --k-ink: light-dark(#1a1a1f, #f2f4f8);
    --k-drop: light-dark(rgba(26,26,31,.06), rgba(0,0,0,.32)); --k-brand: light-dark(#5a5ae6, #8b7cff); }
  .switcher :is(.frame-use, [data-tweaks-keep]) { --k-face: light-dark(#ebebfc, #332d5c); --k-face-hv: light-dark(#e2e2fa, #3c3569);
    --k-edge: var(--k-brand); --k-edge-hv: light-dark(#4a4ad6, #a796ff); --k-base: light-dark(#4a4ad6, #7a6af0);
    --k-lip: light-dark(#cdcdf4, #231e45); --k-lip-hv: light-dark(#c4c4f0, #2a2452); --k-hi: light-dark(rgba(255,255,255,.6), rgba(255,255,255,.07)); }
  /* on the canvas no tab is selected (data-canvas-view): every direction shows, so none is the open one */
  .switcher :is([aria-pressed=true], [aria-expanded=true], [open]>summary, .frame-use[data-chosen]),
  .switcher:not([data-canvas-view]) .switcher-tabs [aria-selected=true] { --k-face: light-dark(#f1f0fd, #2b2352); --k-face-hv: light-dark(#f1f0fd, #2b2352);
    --k-edge: var(--k-brand); --k-edge-hv: var(--k-brand); --k-base: var(--k-brand); --k-ink: light-dark(#3f3fbd, #e2dbff); --k-sh: inset 0 1px 2px var(--k-drop); }
  .switcher.switcher :where(button, summary):not([hidden], .menu button) { box-sizing: border-box; display: inline-flex; align-items: center;
    justify-content: center; gap: 6px; min-height: 28px; padding: 3px 10px; border: 1px solid var(--k-edge); border-bottom-color: var(--k-base);
    border-radius: 6px; background: var(--k-face); color: var(--k-ink); font: 600 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
    box-shadow: var(--k-sh, inset 0 -2px 0 var(--k-lip), inset 0 1px 0 var(--k-hi), 0 1px 1px var(--k-drop)); white-space: nowrap; cursor: pointer; transition: .1s;
    &:hover:not(:disabled) { --k-face: var(--k-face-hv); --k-edge: var(--k-edge-hv); --k-base: var(--k-edge-hv); --k-lip: var(--k-lip-hv); }
    &:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 1px 2px var(--k-drop); }
    &:focus-visible { outline: 2px solid var(--k-focus); outline-offset: 2px; }
    &:disabled { cursor: default; }
    /* small keys, a finger's reach: on a touch screen each answers 8px above and below its face */
    @media (pointer: coarse) { position: relative; &::before { content: ""; position: absolute; inset: -8px -3px; } } }
  .switcher { position: sticky; top: 0; z-index: 10; background: var(--bar-bg); border-bottom: 1px solid var(--bar-line);
    padding: 8px 12px 6px; font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--bar-ink); }
  .switcher-row { display: flex; align-items: center; gap: 8px; }
  .switcher-tabs { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .switcher-tabs button { flex: 0 0 auto; }
  .switcher-line { margin: 6px 2px 0; font-size: 13px; color: var(--bar-muted); min-height: 1.3em; }
  .switcher-answers { margin: 2px 2px 0; font-size: 13px; color: var(--bar-muted); }
  .switcher-answers:empty { display: none; }
  /* the canvas: Spacesheep's pan and zoom is one block of the page, <div data-ss-canvas-area>, holding every direction.
     While it runs (its stage is in the area), the page is one screen: the bar, then the area filling the rest, inside
     the viewer's own padding (64 px under its header), so the page never scrolls under the bar. Off it, the area is
     an ordinary block. */
  html:has([data-ss-canvas-area] > [data-ss-canvas-stage]) { box-sizing: border-box; height: 100%; }
  html:has([data-ss-canvas-area] > [data-ss-canvas-stage]) body { display: flex; flex-direction: column; height: 100%; margin: 0; }
  html:has([data-ss-canvas-area] > [data-ss-canvas-stage]) .switcher { flex: none; }
  [data-ss-canvas-area]:has(> [data-ss-canvas-stage]) { flex: 1 1 auto; height: auto; min-height: 320px; }
  html:not(:has([data-ss-canvas-area])) .direction:not(.on) { display: none; }
  /* device views: a direction's phone or tablet view, <section class="direction" data-view-of="<slug>"
     data-ss-frame="phone">, is a frame of its own on the canvas, never a tab. Without the canvas, the device
     buttons under the tabs show one at a time, at its frame's width, and a phone opens on its phone view.
     Each direction and frame is a container, and the kit's phone rules are container queries: a frame lays
     out at its own width, wherever it is drawn and however wide the window is. */
  .direction, [data-ss-frame] { container-type: inline-size; }
  .switcher-views { display: flex; gap: 6px; margin-top: 6px; }
  .switcher-views:empty, html:has([data-ss-canvas-area]) .switcher-views { display: none; }
  /* a one-design page's nav that holds only the device row (fold.js kit adds it) shows only when it has buttons */
  .switcher:has(> .switcher-views:only-child:empty),
  html:has([data-ss-canvas-area]) .switcher:has(> .switcher-views:only-child) { display: none; }
  html:not(:has([data-ss-canvas-area])) .direction[data-view-of] { margin-inline: auto; }
  html:not(:has([data-ss-canvas-area])) .direction[data-view-of][data-ss-frame="phone"] { max-width: 390px; }
  html:not(:has([data-ss-canvas-area])) .direction[data-view-of][data-ss-frame="tablet"] { max-width: 820px; }
  /* rounds: start */
  /* a round's versions sit in a row below, each joined to the direction it came from by a line: one block,
     [data-round-lines], that fold.js round draws behind the frames. Only the canvas shows it. */
  [data-round-lines] { z-index: -1; pointer-events: none; outline: none; }
  [data-round-lines] svg { display: block; overflow: visible; }
  /* each line is drawn from its version up, and starts 24 px (on screen) above it, clear of the version's label */
  [data-round-lines] path { fill: none; stroke: light-dark(#9a9aa6, #6b6b78); stroke-width: calc(1.5px / var(--ss-cz, 1)); stroke-linecap: round;
    stroke-dasharray: 0 min(calc(24px / var(--ss-cz, 1)), 200px) 100000; }
  html:not(:has([data-ss-canvas-area])) [data-round-lines] { display: none; }
  /* rounds: end */
  /* about: start */
  /* Each direction's about block (data-about-of="<slug>"): what it is for and how to try it, its spec row, and a
     numbered caption for each of its frames. It sits on the canvas 120 px above its direction, as wide as it, its
     words from the top of its 560 px, so a row's blocks start on one line and read across, outside the design: no
     picture, PDF, HTML export or build prompt has it, and without the canvas it doesn't show. Its type stays 13 px
     on screen at any zoom, from 20 to 36 px. Under 600 px of canvas width (a phone at Fit) the blocks would run into
     the cards below them: the area is data-narrow there (the about script measures it), they hide, and the bar
     shows the intro of the direction open full page. */
  .about { box-sizing: border-box; height: 560px; display: flex; flex-direction: column; justify-content: flex-start; gap: .55em;
    color: var(--bar-ink); font: 400 clamp(20px, calc(13px / var(--ss-cz, 1)), 36px)/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  [data-ss-canvas-item].about { outline: none; }
  .about p { margin: 0; max-width: 62ch; }
  .about-spec { display: flex; flex-wrap: wrap; gap: .2em 1.4em; margin: 0; font-size: .82em; }
  .about-spec div { display: flex; gap: .45em; align-items: baseline; }
  .about-spec dt { color: var(--bar-muted); font: 500 .8em/1.4 ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: .06em; }
  .about-spec dd { margin: 0; }
  .about-swatch { display: inline-block; width: .8em; height: .8em; margin-right: .2em; border-radius: 2px; vertical-align: -.05em;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bar-ink) 30%, transparent); }
  .about-frames { margin: 0; padding: 0; list-style: none; font-size: .82em; color: var(--bar-muted); }
  .about-frames li::before { content: attr(data-n) "  "; white-space: pre; color: var(--bar-ink); font: 500 .9em/1.4 ui-monospace, Menlo, monospace; }
  html:not(:has([data-ss-canvas-area])) .about { display: none; }
  [data-ss-canvas-area][data-narrow] .about { display: none; }
  /* about: end */
  /* the frame's own controls: Back while a direction is open full page (Esc does the same); the canvas area draws its own zoom */
  .frame-back, .frame-use, .frame-round { flex: none; }
  /* Use this and Another round, at the bar's right end while a direction is open: the primary key, then a secondary
     one beside it, each saying its line ("Use <name>", "Another round of <name>") in the chat. The direction the person
     chose (data-chosen) has its card's edge and its tab marked, and Use this says Chosen, pressed in. */
  .frame-use { margin-left: auto; }
  /* on a phone the tabs take a row of their own under Back and the pill, never a squeezed column */
  .switcher { container-type: inline-size; }
  @container (max-width: 40rem) { .switcher-row { flex-wrap: wrap; } .switcher-tabs { order: 1; flex-basis: 100%; } }
  /* on a phone, once a page has rounds, the tabs are the newest round and the direction it came from: the rest
     (data-older) stay on the canvas, where their number keys open them, and one open full page keeps its tab.
     Without the canvas every tab shows, as the tabs are then the only way to a direction. */
  @container (max-width: 40rem) {
    html:has([data-ss-canvas-area]) .switcher-tabs button[data-older] { display: none; }
    .switcher:has(.frame-back:not([hidden])) .switcher-tabs button[data-older][aria-selected="true"] { display: inline-flex; }
  }
  .switcher-tabs button[data-chosen]::after { content: " \2713"; }
  /* the chosen edge is the frame's own edge, 2 px at any canvas zoom, so it stays under the label row 3 px above */
  .direction[data-chosen] { outline: calc(2px / var(--ss-cz, 1)) solid var(--bar-ink); outline-offset: 0; }
  /* Each direction's card has a ⋯ menu, Use this · Another round: Spacesheep's canvas draws it at the right end of
     the card's label row (data-ss-canvas="label"), at screen size and outside the design. Until the canvas lifts it
     there it shows nowhere; nor with one direction, nor while a direction is open, when the bar's pair is the one.
     ⋯ is a small outline chip in the type of the canvas's own labels (01 · Name) and the edge of its number boxes,
     the chosen card has a bare ✓ beside it (named Chosen, its tooltip too: the tab and the card's line say the word), and the menu drops under it; on a touch screen ⋯ takes a tap 44 px tall,
     reaching up and down to the card's edge without growing. (.use-this alone is an older page's pill.) */
  .use-this { height: 24px; padding: 0 8px; border: 1px solid; border-radius: 5px; background: transparent; color: var(--bar-ink);
    font: 500 11px/1.2 ui-monospace, monospace; white-space: nowrap; cursor: pointer; }
  .use-this:enabled:hover { background: color-mix(in srgb, var(--bar-ink) 8%, transparent); }
  @media (pointer: coarse) { .use-this::after { content: ""; position: absolute; inset: -18px 0 -4px; } }
  .use-this:focus-visible { outline: 2px solid var(--k-focus); outline-offset: 2px; }
  :is(.frame-use, .use-this) .chosen, :is(.frame-use, .use-this)[data-chosen] .use { display: none; }
  :is(.frame-use, .use-this)[data-chosen] .chosen { display: inline; }
  :is(.frame-use, .use-this)[data-chosen] { cursor: default; }
  .card-menu { display: inline-flex; align-items: center; gap: 6px; color: var(--bar-ink); font: 500 11px/1.2 ui-monospace, monospace; white-space: nowrap; }
  .card-menu:has(.use-this[data-chosen])::before { content: "✓" / "Chosen"; }
  .menu-open { position: relative; width: 24px; height: 24px; padding: 0; border: 1px solid; border-radius: 5px; background: transparent; color: inherit;
    font: 13px/1 ui-monospace, monospace; cursor: pointer; }
  .card-menu .menu { position: absolute; z-index: 1; top: calc(100% + 4px); right: 0; display: grid; min-width: 160px; padding: 4px;
    background: var(--bar-bg); border: 1px solid var(--bar-line); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.16); }
  .card-menu .menu[hidden] { display: none; }
  .card-menu .menu > button { position: relative; height: 32px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent;
    color: inherit; font: inherit; font-size: 12px; text-align: left; cursor: pointer; }
  .card-menu .menu > button::after { content: none; }
  .card-menu .menu > button:disabled { cursor: default; }
  :is(.menu-open:hover, .menu-open[aria-expanded="true"], .card-menu .menu > button:enabled:hover) { background: color-mix(in srgb, var(--bar-ink) 8%, transparent); }
  :is(.menu-open, .card-menu .menu > button):focus-visible { outline: 2px solid var(--k-focus); outline-offset: 2px; }
  @media (pointer: coarse) { .menu-open::after { content: ""; position: absolute; inset: -18px -10px -4px; } .card-menu .menu > button { height: 44px; } }
  section.direction :is(.use-this, .card-menu), html:has(.frame-back:not([hidden])) :is(.use-this, .card-menu),
  html:not(:has(section.direction:not([data-view-of]) ~ section.direction:not([data-view-of]))) :is(.use-this, .card-menu) { display: none; }
  /* Export, last in the bar's row: an outline pill (on a phone its icon alone, 44 px), whose menu drops under it as the
     card menu's does. Open, it is tinted, not filled: a filled pill is the open direction. What it says back (Copied,
     or why a PDF or file wasn't made) is a small card in the same place. */
  .export { position: relative; flex: none; margin-left: auto; font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .switcher-row > .frame-use:not([hidden]) ~ .export { margin-left: 0; }
  .export-open svg { flex: none; width: 16px; height: 16px; }
  @container (max-width: 40rem) { .switcher.switcher .export > .export-open { width: 28px; padding: 0; } .export-word { display: none; } }
  .export .menu, .export-said { position: absolute; z-index: 1; top: calc(100% + 6px); right: 0; background: var(--bar-bg); color: var(--bar-ink);
    border: 1px solid var(--bar-line); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.16); }
  .export .menu { display: grid; min-width: 240px; padding: 4px; }
  .export .menu[hidden], .export .menu > [hidden], .export-said:empty { display: none; }
  .export .menu > button { min-height: 36px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: inherit; font: inherit;
    text-align: left; white-space: nowrap; cursor: pointer; }
  .export .menu > button:hover { background: color-mix(in srgb, var(--bar-ink) 8%, transparent); }
  .export .menu > button:focus-visible { outline: 2px solid var(--k-focus); outline-offset: -2px; }
  .export .menu > hr { width: 100%; margin: 4px 0; border: 0; border-top: 1px solid var(--bar-line); }
  @media (pointer: coarse) { .export .menu > button { min-height: 44px; } }
  .export-said { width: max-content; max-width: min(320px, calc(100vw - 24px)); margin: 0; padding: 8px 12px; font-size: 13px; }
  .export-said pre { max-height: 40vh; overflow: auto; margin: 8px 0 0; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; user-select: all; }
  /* switcher: end */

  /* controls: the Prototype bar, a black strip under the tabs, open from the start (its title folds it). Each state
     worth comparing (who looks, empty or full, a menu open, dark) is a labelled switch of segments that really changes
     the design, as in Open Design's prototypes: a switch or choice draws its segments from its input, which hides; a
     colour or slider stays an input. A Sample note in it names what is made up. It is the frame's, not the design's:
     black and white and 12 px, in light or dark. On the canvas a change goes to every direction, with one open to it. */
  .tweaks { margin: 8px -12px 0; padding: 6px 12px; background: #111; color: #bdbdc4; font: 500 12px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tweaks:not(:has(input[data-var])) { display: none; }
  .tweaks summary { list-style: none; }
  .tweaks summary::-webkit-details-marker { display: none; }
  .switcher.switcher .tweaks.tweaks > summary { display: inline; padding: 0; border: 0; background: none; box-shadow: none; color: #fff;
    font: inherit; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
  .tweaks-body { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin-top: 6px; }
  .tweaks label { display: inline-flex; align-items: center; gap: 8px; }
  .tweaks input { margin: 0; accent-color: #fff; }
  .tweaks label[data-seg] :is(input, output) { display: none; }
  .tweaks .seg { display: inline-flex; padding: 2px; border-radius: 7px; background: #26262e; }
  .switcher.switcher .tweaks :is(.seg > button, [data-tweaks-keep]) { min-height: 22px; padding: 2px 9px; border: 0; border-radius: 5px;
    background: none; box-shadow: none; color: inherit; font: inherit; &:hover { background: #33333d; color: #fff; } &:focus-visible { outline-color: #fff; } }
  .switcher.switcher .tweaks .seg > button[aria-checked="true"] { background: #fff; color: #111; }
  .switcher.switcher .tweaks.tweaks [data-tweaks-keep] { order: 8; box-shadow: inset 0 0 0 1px #6b6b75; color: #fff; }
  .sample-note { order: 9; margin: 0 0 0 auto; }
  :is(.sample-note b, .k-sample) { margin-right: 6px; padding: 1px 5px; border: 1px solid; border-radius: 4px;
    font-size: 10px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
  .sample-note b { border-color: #4a4a55; color: #fff; }
  /* a Sample tag in the design, beside a made-up number or list: quiet, in the design's own muted ink */
  .k-sample { display: inline-block; vertical-align: .15em; margin-left: 6px; color: var(--brand-muted, currentColor); white-space: nowrap; }
  @media (pointer: coarse) { .switcher.switcher .tweaks .seg > button { min-height: 32px; } }

  /* shared: what every direction uses */
  :root { --space: 8px; --radius: 6px; --step-0: 16px; --step-1: 20px; --step-2: 25px; --step-3: 31px; --step-4: 39px; --step-5: 49px;
    --ease: cubic-bezier(.2,.7,.2,1); --dur: 240ms; }
  *, *::before, *::after { box-sizing: border-box; }
  .direction [hidden] { display: none !important; } /* a part a script hides stays hidden, whatever display it has */
  body { margin: 0; overflow-wrap: break-word; }
  img, svg { max-width: 100%; height: auto; }
  h1, h2, h3 { text-wrap: balance; } p { text-wrap: pretty; }
  :focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
  .direction { background: var(--brand-ground); color: var(--brand-ink); font: var(--step-0)/1.6 var(--font-body); min-height: 70vh; }

  /* phone guard: rows wrap and stack, so nothing scrolls sideways or runs past an edge at 390 px */
  :where(.direction *) { min-width: 0; }
  :where(.direction) :where(pre, code, kbd, samp) { white-space: pre-wrap; overflow-wrap: anywhere; }

  /* the kit: finished parts a direction composes and restyles through its tokens.
     Colour comes in pairs, a surface and the text on it: ground/ink, ground/muted, surface/on-surface,
     surface/muted, accent/on-accent, and accent as text on ground. Shape and rhythm: --radius, --density,
     --rule, --shadow, --label-case, --label-track, --display-weight, --measure. Looks sit in :where(),
     so a direction's own CSS wins; the guards (wrapping, no stray cell, fields that fit) hold. */
  :where(.direction) {
    --brand-surface: color-mix(in srgb, var(--brand-ink) 6%, var(--brand-ground));
    --brand-on-surface: var(--brand-ink);
    --brand-muted: color-mix(in srgb, var(--brand-ink) 74%, var(--brand-ground));
    --brand-on-accent: var(--brand-ground);
    --density: 1; --rule: 1px; --shadow: none; --label-case: none; --label-track: 0; --display-weight: 650; --measure: 62ch;
    --s1: calc(4px * var(--density)); --s2: calc(8px * var(--density)); --s3: calc(16px * var(--density));
    --s4: calc(24px * var(--density)); --s5: calc(40px * var(--density)); --s6: calc(64px * var(--density));

<script>
/* Nothing in a script here is declared at its top with const, let or class, only functions and what's inside
   blocks: a live push that changes a script runs the page's scripts again in the same tab, where a name
   declared at a script's top a second time stops that whole script before its first line, the switcher too. */
/* switcher: start */
(() => {
  const tabsNow = () => document.querySelector('.switcher-tabs');
  const lineNow = () => document.querySelector('.switcher-line');
  const viewsNow = () => document.querySelector('.switcher-views');
  // One design has no tabs: the script still shows it, and its views' buttons.
  if (!tabsNow() && !document.querySelector('section.direction')) return;
  // A direction's device views (data-view-of="<its slug>") are frames of their own, never tabs.
  const all = () => [...document.querySelectorAll('section.direction:not([data-view-of])')];
  const views = () => [...document.querySelectorAll('section.direction[data-view-of]')];
  const slugOf = (d) => (d.dataset.ssId || '').replace(/^direction-/, '');
  const dirOf = (v) => all().find((d) => slugOf(d) === v.dataset.viewOf);
  const viewsOf = (d) => views().filter((v) => v.dataset.viewOf === slugOf(d));
  const label = (d) => d.dataset.ssLabel || d.dataset.name || d.dataset.ssId || '';
  const device = (x) => ({ desktop: 'Desktop', tablet: 'Tablet', phone: 'Phone' })[x.dataset.ssFrame] || (x.dataset.viewOf ? label(x) : 'Desktop');
  const hashOf = (d) => '#' + encodeURIComponent(d.dataset.ssId); // pick decodes it
  // Once a page has rounds (versions, data-version-of="<parent's slug>", each with its data-round), the newest
  // round and the direction it came from: on a phone the other tabs are marked data-older, and hide on the canvas.
  const round = (d) => +d.dataset.round || 2;
  function newest() {
    const vs = all().filter((d) => d.dataset.versionOf);
