<!DOCTYPE html>
<!--
  The starter page: copy it to index.html.
  1. Set the title, the directions' tokens and each section's opening tag, one Edit each: each direction's
     slug (direction-slug, its blocks slug-part), data-ss-label (its name), data-line and tokens.
  2. Push it: that is the frame. Then assets/fold.js draws each direction in parts, between its
     part:slug markers, in place of its .drawing block. Leave the markers: fold.js names them after the slug.
  One design, not directions: keep one section, and drop the switcher's nav and script.
  Keep the metas, the switcher and the ids.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design title</title>
<meta name="ss-chat" content="open">
<meta name="ss-workspace" content="design">
<meta name="ss-canvas" content="on">
<style>
  /* switcher: start */
  .switcher { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #ddd;
    padding: 8px 12px 6px; font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111; }
  .switcher-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .switcher-tabs::-webkit-scrollbar { display: none; }
  .switcher-tabs button { flex: 0 0 auto; min-height: 44px; padding: 0 14px; border: 1px solid #ccc;
    border-radius: 22px; background: #fff; color: #111; font: inherit; cursor: pointer; }
  .switcher-tabs button[aria-selected="true"] { background: #111; color: #fff; border-color: #111; }
  .switcher-tabs button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  .switcher-line { margin: 6px 2px 0; font-size: 13px; color: #555; min-height: 1.3em; }
  html:not(:has(meta[name="ss-canvas"][content="on"])) .direction:not(.on) { display: none; }
  /* switcher: end */

  /* shared: what every direction uses */
  :root { --space: 8px; --radius: 6px; --step-0: 16px; --step-1: 20px; --step-2: 25px; --step-3: 31px; --step-4: 39px; --step-5: 49px;
    --ease: cubic-bezier(.2,.7,.2,1); --dur: 240ms; }
  *, *::before, *::after { box-sizing: border-box; }
  .direction [hidden] { display: none !important; } /* a part a script hides stays hidden, whatever display it has */
  body { margin: 0; overflow-wrap: break-word; }
  img, svg { max-width: 100%; height: auto; }
  h1, h2, h3 { text-wrap: balance; } p { text-wrap: pretty; }
  :focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
  .direction { background: var(--brand-ground); color: var(--brand-ink); font: var(--step-0)/1.6 var(--font-body); min-height: 70vh; }

  /* phone guard: rows wrap and stack, so nothing scrolls sideways or runs past an edge at 390 px */
  :where(.direction *) { min-width: 0; }
  :where(.direction) :where(pre, code, kbd, samp) { white-space: pre-wrap; overflow-wrap: anywhere; }
  .cards { display: grid; gap: calc(var(--space) * 2); grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
    margin: 0; padding: 0; list-style: none; }
  .stack { width: 100%; border-collapse: collapse; }
  @media (max-width: 40rem) {
    .stack, .stack tbody, .stack tr { display: block; }
    .stack thead { display: none; }
    .stack tr { padding: var(--space) 0; border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
    .stack td { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: calc(var(--space) * 2); padding: 2px 0; text-align: right; }
    .stack td::before { content: attr(data-label); text-align: left; opacity: .75; }
    .stack td:first-child { display: block; text-align: left; font-weight: 600; }
    .stack td:first-child::before { content: none; }
  }

  /* being drawn: replaced by the direction itself */
  .drawing { padding: calc(var(--space) * 6) calc(var(--space) * 3); }
  .drawing h2 { margin: 0 0 var(--space); font: 600 var(--step-4)/1.1 var(--font-display); }
  .drawing p { margin: 0 0 calc(var(--space) * 4); opacity: .8; }
  .drawing i { display: block; height: 14px; margin: 0 0 12px; border-radius: 7px; background: currentColor; opacity: .12;
    animation: drawing 1.4s var(--ease) infinite alternate; }
  .drawing i:nth-of-type(2) { width: 80%; } .drawing i:nth-of-type(3) { width: 55%; }
  @keyframes drawing { to { opacity: .28; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<script>
/* draw: a direction's script builds what it shows (cards, rows, lists, counts) in one function and passes it
   to ssDraw, which runs it now and again after every live push: a push puts each part back as the source has
   it, so what a script drew there is gone until it draws again. */
function ssDraw(fn) { fn(); document.addEventListener('ss:live', () => fn()); }
</script>
</head>
<body>

<nav data-ss-canvas="pin" class="switcher no-print" aria-label="Design directions" data-ss-react="off">
  <div class="switcher-tabs" role="tablist"></div>
  <p class="switcher-line" aria-live="polite"></p>
</nav>

<style>
  /* each direction: its own tokens. Set them here, and each section's slug, name and line on its opening tag */
  [data-ss-id="direction-first"]  { --brand-ink: #1d2320; --brand-ground: #f3f5f2; --brand-accent: #1f6f50;
    --font-display: "Iowan Old Style", Palatino, Georgia, serif; --font-body: "Avenir Next", "Segoe UI", sans-serif; }
  [data-ss-id="direction-second"] { --brand-ink: #f2efe8; --brand-ground: #15171c; --brand-accent: #ffb703;
    --font-display: "Avenir Next", Futura, "Gill Sans", sans-serif; --font-body: "Avenir Next", "Segoe UI", sans-serif; }
  [data-ss-id="direction-third"]  { --brand-ink: #10242e; --brand-ground: #e6eef2; --brand-accent: #c2410c;
    --font-display: ui-monospace, Menlo, monospace; --font-body: Charter, "Iowan Old Style", Georgia, serif; }
</style>

<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-first" data-ss-thing="direction/first" data-ss-label="First" data-line="One line on what it leads with." data-ss-x="0" data-ss-y="0">
  <!-- part:first --><div class="drawing" data-ss-id="first-drawing"><h2>First</h2><p>Being drawn…</p><i></i><i></i><i></i></div><!-- /part:first -->
</section>

<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-second" data-ss-thing="direction/second" data-ss-label="Second" data-line="One line on what it leads with." data-ss-x="1352" data-ss-y="0">
  <!-- part:second --><div class="drawing" data-ss-id="second-drawing"><h2>Second</h2><p>Being drawn…</p><i></i><i></i><i></i></div><!-- /part:second -->
</section>

<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-third" data-ss-thing="direction/third" data-ss-label="Third" data-line="One line on what it leads with." data-ss-x="2704" data-ss-y="0">
  <!-- part:third --><div class="drawing" data-ss-id="third-drawing"><h2>Third</h2><p>Being drawn…</p><i></i><i></i><i></i></div><!-- /part:third -->
</section>

<script>
/* Nothing in a script here is declared at its top with const, let or class, only functions and what's inside
   blocks: a live push that changes a script runs the page's scripts again in the same tab, where a name
   declared at a script's top a second time stops that whole script before its first line, the switcher too. */
/* switcher: start */
(() => {
  const tabsNow = () => document.querySelector('.switcher-tabs');
  const lineNow = () => document.querySelector('.switcher-line');
  if (!tabsNow()) return;
  const all = () => [...document.querySelectorAll('section.direction')];
  const label = (d) => d.dataset.ssLabel || d.dataset.name || d.dataset.ssId || '';
  const hashOf = (d) => '#' + encodeURIComponent(d.dataset.ssId); // fromHash decodes it
  let cur = null, drawn = null;
  function fromHash() {
    const dirs = all();
    let id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch {}
    return dirs.find((d) => d.dataset.ssId === id)
      || dirs.find((d) => d.contains(document.getElementById(id) || document.querySelector('[data-ss-id="' + CSS.escape(id) + '"]')))
      || dirs.find((d) => d.hasAttribute('data-default'))
      || dirs[0];
  }
  function show(d) {
    if (!d) return;
    cur = d;
    const tabs = tabsNow(), line = lineNow();
    all().forEach((x, i) => {
      x.classList.toggle('on', x === d);
      if (tabs && tabs.children[i]) tabs.children[i].setAttribute('aria-selected', String(x === d));
    });
    if (line) line.textContent = d.dataset.line || '';
  }
  function draw() {
    try { drawn = tabsNow(); if (drawn) drawn.replaceChildren(...all().map((d) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.textContent = label(d);
      b.addEventListener('click', () => { history.replaceState(null, '', hashOf(d)); show(d); dispatchEvent(new HashChangeEvent('hashchange')); });
      return b;
    }));
    show(fromHash()); } finally { watch.takeRecords(); } // its own changes mustn't call it again
  }
  // A live push redraws the page from its source, where the tabs are empty, and on a canvas page it puts
  // fresh copies of the tabs and line in place of these: draw them again, into the ones on the page now.
  const stale = () => {
    const dirs = all(), tabs = tabsNow(), line = lineNow();
    return tabs !== drawn || (tabs && (tabs.children.length !== dirs.length || dirs.some((d, i) => tabs.children[i].textContent !== label(d))))
      || !document.contains(cur) || (line && line.textContent !== (cur.dataset.line || ''));
  };
  const watch = new MutationObserver(() => { if (stale()) draw(); });
  watch.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-ss-label', 'data-name', 'data-line', 'data-ss-id'] });
  addEventListener('hashchange', () => show(fromHash()));
  draw();
  if (cur && !location.hash && cur.hasAttribute('data-default') && document.querySelector('meta[name="ss-canvas"][content="on"]')) {
    history.replaceState(null, '', hashOf(cur));
  }
})();
/* switcher: end */
/* check: only when the address has ?ss-check (the save's pictures), never in a person's view. Once the page
   has loaded, it measures each direction at this width for what a picture can't be trusted to show:
     narrow  words in a column so thin they run under 4 characters a line
     wide    words or a control running past the direction's edge
     cut     words drawn outside a box that hides or scrolls its overflow, past its sides or its top or bottom
             (up and down, a glyph may overhang its line by a third of the font size: tight display type)
     redraw  words, parts or their order a live push changes for good: a script drew them once, not through ssDraw
   It outlines each in red and asks for ss-fault/<slug>/<kind>/<element>.png, which doesn't exist: the
   picture's answer lists that request, and fold.js prints it as a fault. First the canvas goes off and
   every direction shows, full width and unscaled, as a person sees it on its own. */
if (/[?&]ss-check\b/.test(location.search)) {
  const canvas = document.querySelector('meta[name="ss-canvas"]');
  if (canvas) canvas.content = 'off';
  document.head.append(Object.assign(document.createElement('style'), { textContent: 'section.direction { display: block !important; } .switcher { display: none !important; }' }));
}
if (/[?&]ss-check\b/.test(location.search)) addEventListener('load', () => (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  const own = (v) => v && !/^auto-/.test(v) ? v : ''; // the renderer gives unnamed blocks auto- ids
  const name = (e) => e.tagName.toLowerCase() + (own(e.dataset.ssId) ? `[data-ss-id=${e.dataset.ssId}]` : e.id ? `#${e.id}` : e.classList.length ? `.${[...e.classList].slice(0, 2).join('.')}` : '');
  const shown = (e) => { for (let x = e; x; x = x.parentElement) { const s = getComputedStyle(x); if (s.display === 'none' || s.visibility === 'hidden') return false; } return true; };
  const skip = 'script, style, template, svg, [hidden], [aria-hidden=true]';
  for (const sec of document.querySelectorAll('section.direction')) {
    const slug = (sec.dataset.ssId || '').replace(/^direction-/, '');
    const box = sec.getBoundingClientRect();
    if (!box.width || !shown(sec)) continue;
    const k = box.width / (sec.offsetWidth || box.width); // a canvas may scale the direction
    const seen = new Set();
    const fault = (kind, el, text) => {
      const key = kind + name(el);
      if (seen.has(key) || seen.size >= 8) return;
      seen.add(key);
      el.style.outline = '3px solid #e00';
      const i = new Image();
      i.src = `ss-fault/${slug}/${kind}/${encodeURIComponent(name(el))}.png?t=${encodeURIComponent(text.replace(/\s+/g, ' ').trim().slice(0, 40))}`;
    };
    const lines = (n) => { const g = document.createRange(); g.selectNodeContents(n); return [...g.getClientRects()].filter((x) => x.width > 0); };
    const walk = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT);
    for (let n; (n = walk.nextNode()); ) {
      const t = n.textContent.replace(/\s+/g, ' ').trim(), el = n.parentElement;
      if (t.length < 12 || !el || el.closest(skip) || !shown(el)) continue;
      const tops = new Set(lines(n).map((x) => Math.round(x.top / k / 4)));
      if (tops.size >= 4 && t.length / tops.size < 4) fault('narrow', el, t);
    }
    const past = (q) => (q.right - box.right) / k > 2 || (box.left - q.left) / k > 2;
    const inside = (q) => q.right > box.left + 1 && q.left < box.right - 1;
    for (const el of sec.querySelectorAll('*')) {
      if (el.closest(skip) || !shown(el)) continue;
      const words = [...el.childNodes].filter((n) => n.nodeType === 3 && n.textContent.trim()), control = el.matches('a, button, input, select, textarea, label');
      if (!words.length && !control) continue; // decoration may bleed off an edge
      const r = el.getBoundingClientRect();
      if (r.width <= 1 || r.height <= 1 || getComputedStyle(el).position === 'fixed') continue; // visually hidden, or pinned
      const spans = words.flatMap(lines), reach = spans.concat(control || !spans.length ? [r] : []);
      const over = parseFloat(getComputedStyle(el).fontSize) / 3 || 0;
      for (let x = el; x && x !== sec; x = x.parentElement) {
        const o = getComputedStyle(x);
        if (o.overflowX === 'visible' && o.overflowY === 'visible') continue;
        const c = x.getBoundingClientRect();
        const side = o.overflowX !== 'visible' && spans.some((q) => (q.right - c.right) / k > 2 || (c.left - q.left) / k > 2);
        const end = o.overflowY !== 'visible' && spans.some((q) => (q.bottom - c.bottom) / k > Math.max(2, over) || (c.top - q.top) / k > Math.max(2, over));
        if (side || end) fault('cut', el, el.textContent);
        break;
      }
      if (reach.some(inside) && reach.some(past)) fault('wide', el, el.textContent);
    }
  }
  // redraw: then a live push, as it lands on a tab with the page open. Each part a script filled goes back to what
  // the page's own source holds there, and ss:live fires, as the platform does. A direction whose words or parts
  // then differ from the fresh load lost them. A part is found in the source by its name, else by the steps down
  // to it from the nearest named part. Parts holding a script, and form fields' insides, which a push keeps, stay
  // as they are. The source is the copy this tab just loaded, from the browser's cache, else the server's. A page
  // whose source can't be read, or holds other directions, isn't measured, and asks for
  // ss-note/redraw-unmeasured.png with the reason, which fold.js prints as a line of its own.
  const key = (e) => own(e.dataset.ssId) ? `[data-ss-id="${CSS.escape(e.dataset.ssId)}"]` : e.id ? `#${CSS.escape(e.id)}` : '';
  const path = (e) => {
    let p = '';
    for (let x = e; x; x = x.parentElement) {
      if (key(x)) return key(x) + p;
      let i = 1;
      for (let s = x.previousElementSibling; s; s = s.previousElementSibling) if (s.localName === x.localName) i++;
      p = ` > ${CSS.escape(x.localName)}:nth-of-type(${i})${p}`;
    }
    return '';
  };
  const kids = (e) => [...e.childNodes].map((n) => n.nodeType === 1 ? n.tagName + key(n) : n.nodeType === 3 ? n.data.replace(/\s+/g, ' ').trim() : '').filter(Boolean).join('|');
  const read = (e) => { const c = e.cloneNode(true); c.querySelectorAll('script, style, template').forEach((x) => x.remove()); return `${c.querySelectorAll('*').length} ${c.textContent.replace(/\s+/g, ' ').trim()}`; };
  const unmeasured = (why) => { new Image().src = `ss-note/redraw-unmeasured.png?t=${encodeURIComponent(String(why).slice(0, 80))}`; };
  return fetch(location.href, { cache: 'force-cache' }).then((r) => r.ok ? r.text() : Promise.reject(`its source answered ${r.status}`)).then((html) => {
    const src = new DOMParser().parseFromString(html, 'text/html'), secs = [...document.querySelectorAll('section.direction')], wiped = [];
    const there = src.querySelectorAll('section.direction').length;
    if (there !== secs.length) return unmeasured(`its source holds ${there} directions, the page ${secs.length}`);
    const fresh = secs.map(read);
    for (const el of document.querySelectorAll('section.direction *')) {
      if (el.closest('script, style, template, select, textarea') || el.querySelector('script') || wiped.some((w) => w.el.contains(el))) continue;
      const k = path(el), was = k && src.querySelector(k);
      if (was && kids(el) !== kids(was)) wiped.push({ el, k, sec: el.closest('section.direction'), was: read(el), text: el.textContent });
    }
    for (const w of wiped) w.el.replaceChildren(...[...src.querySelector(w.k).childNodes].map((n) => document.importNode(n, true)));
    document.dispatchEvent(new CustomEvent('ss:live', { detail: { mode: 'morph', ids: [...document.querySelectorAll('[data-ss-id]')].map((e) => e.dataset.ssId) } }));
    secs.forEach((sec, i) => {
      if (read(sec) === fresh[i]) return;
      const lost = wiped.filter((w) => w.sec === sec && read(sec.querySelector(w.k) || w.el) !== w.was).slice(0, 8);
      const slug = (sec.dataset.ssId || '').replace(/^direction-/, '');
      for (const w of lost.length ? lost : [{ el: sec, text: '' }]) {
        w.el.style.outline = '3px solid #e00';
        let at = w.el; while (at !== sec && !key(at)) at = at.parentElement; // an unnamed part: say which named part holds it
        new Image().src = `ss-fault/${slug}/redraw/${encodeURIComponent((at === w.el ? '' : name(at) + ' ') + name(w.el))}.png?t=${encodeURIComponent(w.text.replace(/\s+/g, ' ').trim().slice(0, 40))}`;
      }
    });
  }).catch((e) => unmeasured((e && e.message) || e));
}));
</script>
</body>
</html>
