<!DOCTYPE html>
<!--
  Design's page for a Shepherd turn: references/shepherd.md says what to change. Copy everything else as it is.
  The questions card comes first, so it shows while the rest of the page is still being written.
  Made from base.html by tools/shepherd.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design title</title>
<meta name="ss-chat" content="open">
<meta name="ss-canvas-focus" content="all">
<style>
.ss-questions{position:relative;z-index:2;box-sizing:border-box;width:min(560px,calc(100% - 24px));max-height:calc(100svh - 120px);overflow:auto;margin:12px auto;padding:20px;display:grid;gap:18px;background:Canvas;color:CanvasText;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.16);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark;}
.ss-questions[hidden]{display:none;}
.ss-questions h2{margin:0;font-size:19px;line-height:1.25;}
.ss-questions p{margin:-10px 0 0;color:color-mix(in srgb,CanvasText 62%,transparent);}
.ss-questions fieldset{display:flex;flex-wrap:wrap;gap:8px;min-width:0;margin:0;padding:0;border:0;}
.ss-questions legend{padding:0 0 8px;font-weight:600;}
.ss-questions label{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid color-mix(in srgb,CanvasText 28%,transparent);border-radius:8px;cursor:pointer;}
.ss-questions label:has(input:checked){background:CanvasText;color:Canvas;border-color:CanvasText;}
.ss-questions label:has(input:focus-visible),.ss-questions :is(input[type="text"],.ss-start):focus-visible{outline:2px solid #4f46e5;outline-offset:2px;}
.ss-questions label input{position:absolute;opacity:0;pointer-events:none;}
.ss-questions input[type="text"]{flex:1 1 160px;min-height:44px;padding:0 12px;border:1px solid color-mix(in srgb,CanvasText 28%,transparent);border-radius:8px;background:transparent;color:inherit;font:inherit;}
.ss-questions :disabled{cursor:default;}
.ss-start{min-height:48px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font:600 16px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;}
.ss-start:disabled{opacity:.62;}
.ss-questions .ss-why{margin:-6px 0 0;color:light-dark(#b42318,#ff9b8f);}
.ss-questions .ss-why:empty{display:none;}
body:has(>.ss-questions:not([hidden]))>:is(.switcher,[data-ss-canvas-area]){display:none!important;}
</style>
</head>
<body>

<div class="ss-questions no-print" data-ss-id="design-questions" data-ss-comments="off" data-ss-react="off">
  <h2>A few choices before I draw</h2>
  <p>My picks are chosen. Change any, then press Start designing.</p>
  <fieldset><legend>How should it feel?</legend>
    <label><input type="radio" name="look" value="Warm and homely" checked>Warm and homely</label>
    <label><input type="radio" name="look" value="Clean and modern">Clean and modern</label>
    <label><input type="radio" name="look" value="Bold and playful">Bold and playful</label>
  </fieldset>
  <fieldset><legend>What must it show?</legend>
    <label><input type="checkbox" name="must" value="Opening hours" checked>Opening hours</label>
    <label><input type="checkbox" name="must" value="Prices">Prices</label>
    <input type="text" name="must" aria-label="Something else it must show" placeholder="Or say what" maxlength="60">
  </fieldset>
  <button type="button" class="ss-start" data-ss-say="" disabled>Getting ready…</button>
</div>

<style>
/* switcher: start */
:root{color-scheme:light dark;}
.direction{color-scheme:light;}
:root{--bar-bg:#fff;--bar-ink:#111;--bar-line:#ccc;--bar-muted:#555;}
@media (prefers-color-scheme:dark){:root{--bar-bg:#1d1d22;--bar-ink:#f1f1f4;--bar-line:#45454f;--bar-muted:#a6a6b0;}}
.switcher{position:sticky;top:0;z-index:10;background:var(--bar-bg);border-bottom:1px solid var(--bar-line);padding:8px 12px 6px;font:15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--bar-ink);}
.switcher-row{display:flex;align-items:center;gap:8px;}
.switcher-tabs{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:6px;}
.switcher-tabs button{flex:0 0 auto;min-height:44px;padding:0 14px;border:1px solid var(--bar-line);border-radius:22px;background:var(--bar-bg);color:var(--bar-ink);font:inherit;cursor:pointer;}
.switcher-tabs button[aria-selected="true"]{background:var(--bar-ink);color:var(--bar-bg);border-color:var(--bar-ink);}
.switcher[data-canvas-view] .switcher-tabs button[aria-selected="true"]{background:var(--bar-bg);color:var(--bar-ink);border-color:var(--bar-line);}
.switcher-tabs button:focus-visible{outline:3px solid #2563eb;outline-offset:2px;}
.switcher-line{margin:6px 2px 0;font-size:13px;color:var(--bar-muted);min-height:1.3em;}
.switcher-answers{margin:2px 2px 0;font-size:13px;color:var(--bar-muted);}
.switcher-answers:empty{display:none;}
html:has([data-ss-canvas-area] > [data-ss-canvas-stage]){box-sizing:border-box;height:100%;}

html:has([data-ss-canvas-area] > [data-ss-canvas-stage]) .switcher{flex:none;}
[data-ss-canvas-area]:has(> [data-ss-canvas-stage]){flex:1 1 auto;height:auto;min-height:320px;}
html:not(:has([data-ss-canvas-area])) .direction:not(.on){display:none;}
.direction,[data-ss-frame]{container-type:inline-size;}
.frame-back,.frame-use,.frame-round{flex:none;min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border:1px solid var(--bar-line);border-radius:22px;background:var(--bar-bg);color:var(--bar-ink);font:inherit;white-space:nowrap;}
.frame-back,.frame-use,.frame-round{cursor:pointer;}
:is(.frame-back,.frame-use,.frame-round):focus-visible{outline:3px solid #2563eb;outline-offset:2px;}
:is(.frame-back,.frame-use,.frame-round)[hidden]{display:none;}
.frame-use{margin-left:auto;}
.frame-use:has(+ .frame-round:not([hidden])){border-radius:22px 0 0 22px;}
.frame-round{margin-left:-8px;border-left:0;border-radius:0 22px 22px 0;}
.switcher{container-type:inline-size;}
@container (max-width:40rem){.switcher-row{flex-wrap:wrap;}.switcher-tabs{order:1;flex-basis:100%;}}
.switcher-tabs button[data-chosen]::after{content:" \2713";}
.direction[data-chosen]{outline:calc(2px / var(--ss-cz,1)) solid var(--bar-ink);outline-offset:0;}
.use-this{height:24px;padding:0 8px;border:1px solid;border-radius:5px;background:transparent;color:var(--bar-ink);font:500 11px/1.2 ui-monospace,monospace;white-space:nowrap;cursor:pointer;}
.use-this:enabled:hover{background:color-mix(in srgb,var(--bar-ink) 8%,transparent);}
@media (pointer:coarse){.use-this::after{content:"";position:absolute;inset:-18px 0 -4px;}}
.use-this:focus-visible{outline:2px solid #4f46e5;outline-offset:2px;}
:is(.frame-use,.use-this) .chosen,:is(.frame-use,.use-this)[data-chosen] .use{display:none;}
:is(.frame-use,.use-this)[data-chosen] .chosen{display:inline;}
:is(.frame-use,.use-this)[data-chosen]{cursor:default;}
.card-menu{display:inline-flex;align-items:center;gap:6px;color:var(--bar-ink);font:500 11px/1.2 ui-monospace,monospace;white-space:nowrap;}
.card-menu:has(.use-this[data-chosen])::before{content:"✓ Chosen";}
.menu-open{position:relative;width:24px;height:24px;padding:0;border:1px solid;border-radius:5px;background:transparent;color:inherit;font:13px/1 ui-monospace,monospace;cursor:pointer;}
.card-menu .menu{position:absolute;z-index:1;top:calc(100% + 4px);right:0;display:grid;min-width:160px;padding:4px;background:var(--bar-bg);border:1px solid var(--bar-line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);}
.card-menu .menu[hidden]{display:none;}
.card-menu .menu > button{position:relative;height:32px;padding:0 10px;border:0;border-radius:5px;background:transparent;color:inherit;font:inherit;font-size:12px;text-align:left;cursor:pointer;}
.card-menu .menu > button::after{content:none;}
.card-menu .menu > button:disabled{cursor:default;}
:is(.menu-open:hover,.menu-open[aria-expanded="true"],.card-menu .menu > button:enabled:hover){background:color-mix(in srgb,var(--bar-ink) 8%,transparent);}
:is(.menu-open,.card-menu .menu > button):focus-visible{outline:2px solid #4f46e5;outline-offset:2px;}
@media (pointer:coarse){.menu-open::after{content:"";position:absolute;inset:-18px -10px -4px;}.card-menu .menu > button{height:44px;}}
section.direction :is(.use-this,.card-menu),html:has(.frame-back:not([hidden])) :is(.use-this,.card-menu),html:not(:has(section.direction:not([data-view-of]) ~ section.direction:not([data-view-of]))) :is(.use-this,.card-menu){display:none;}
/* switcher: end */
.tweaks{position:relative;flex:none;margin-left:auto;color:var(--bar-ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;}
.tweaks:not(:has(input[data-var])){display:none;}
.tweaks summary{min-height:44px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--bar-line);border-radius:22px;background:var(--bar-bg);cursor:pointer;font-weight:600;list-style:none;white-space:nowrap;}
.tweaks summary::-webkit-details-marker{display:none;}
.tweaks[open] summary{background:var(--bar-ink);color:var(--bar-bg);border-color:var(--bar-ink);}
.tweaks summary:focus-visible{outline:3px solid #2563eb;outline-offset:2px;}
.tweaks-body{position:absolute;right:0;top:calc(100% + 6px);width:min(300px,calc(100vw - 24px));max-height:calc(50vh - 16px);max-height:calc(50svh - 16px);overflow-y:auto;padding:14px;display:grid;gap:10px;background:var(--bar-bg);border:1px solid var(--bar-line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);}
.tweaks label{display:grid;grid-template-columns:1fr auto;gap:4px 8px;}
.tweaks input{grid-column:1 / -1;width:100%;min-height:32px;margin:0;}
.tweaks input[type="color"]{height:36px;border:1px solid var(--bar-line);border-radius:6px;background:var(--bar-bg);}
.tweaks output{color:var(--bar-muted);font-variant-numeric:tabular-nums;}
.tweaks button{min-height:44px;border:0;border-radius:8px;background:var(--bar-ink);color:var(--bar-bg);font:inherit;cursor:pointer;}
</style>

<nav class="switcher no-print" aria-label="Design directions" data-ss-react="off">
  <div class="switcher-row">
    <button type="button" class="frame-back" data-ss-canvas-back aria-keyshortcuts="Escape" title="Back to all directions (Esc)" hidden>← Back</button>
    <div class="switcher-tabs" role="tablist"></div>
    <details class="tweaks">
      <summary>Tweaks</summary>
      <div class="tweaks-body">
        <button type="button" data-tweaks-keep data-ss-say="">Keep these</button>
      </div>
    </details>
    <button type="button" class="frame-use" data-ss-say="" hidden><span class="use">Use this</span><span class="chosen">✓ Chosen</span></button>
    <button type="button" class="frame-round" data-ss-say="" hidden>Another round</button>
  </div>
  <p class="switcher-line" aria-live="polite"></p>
  <p class="switcher-answers"></p>
</nav>

<style>
  /* each direction: its own tokens. Set them here, and each section's slug, name and line on its opening tag */
  [data-ss-id="direction-first"]  { --brand-ink: #1d2320; --brand-ground: #f3f5f2; --brand-accent: #1f6f50;
    --font-display: "Iowan Old Style", Palatino, Georgia, serif; --font-body: "Avenir Next", "Segoe UI", sans-serif; }
  [data-ss-id="direction-second"] { --brand-ink: #f2efe8; --brand-ground: #15171c; --brand-accent: #ffb703;
    --font-display: "Avenir Next", Futura, "Gill Sans", sans-serif; --font-body: "Avenir Next", "Segoe UI", sans-serif; }
  [data-ss-id="direction-third"]  { --brand-ink: #10242e; --brand-ground: #e6eef2; --brand-accent: #b4380a;
    --font-display: ui-monospace, Menlo, monospace; --font-body: Charter, "Iowan Old Style", Georgia, serif; }
</style>

<div data-ss-canvas-area>

<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-first" data-ss-thing="direction/first" data-ss-label="First" data-line="One line on what it leads with." data-ss-x="0" data-ss-y="0">
  <div class="card-menu no-print" data-ss-canvas="label"><button type="button" class="menu-open" aria-haspopup="menu" aria-expanded="false" aria-label="Menu for First">⋯</button><div class="menu" role="menu" hidden><button type="button" class="use-this" role="menuitem" data-ss-say="Use First" title="Use First"><span class="use">Use this</span><span class="chosen">✓ Chosen</span></button><button type="button" class="round" role="menuitem" data-ss-say="Another round of First" title="Another round of First">Another round</button></div></div>
  <!-- part:first --><div class="drawing" data-ss-id="first-drawing"><h2>First</h2><p>Being drawn…</p><i></i><i></i><i></i></div><!-- /part:first -->
</section>

<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-second" data-ss-thing="direction/second" data-ss-label="Second" data-line="One line on what it leads with." data-ss-x="1600" data-ss-y="0">
  <div class="card-menu no-print" data-ss-canvas="label"><button type="button" class="menu-open" aria-haspopup="menu" aria-expanded="false" aria-label="Menu for Second">⋯</button><div class="menu" role="menu" hidden><button type="button" class="use-this" role="menuitem" data-ss-say="Use Second" title="Use Second"><span class="use">Use this</span><span class="chosen">✓ Chosen</span></button><button type="button" class="round" role="menuitem" data-ss-say="Another round of Second" title="Another round of Second">Another round</button></div></div>
  <!-- part:second --><div class="drawing" data-ss-id="second-drawing"><h2>Second</h2><p>Being drawn…</p><i></i><i></i><i></i></div><!-- /part:second -->
</section>

<section class="direction" data-ss-frame="desktop" data-ss-section data-ss-id="direction-third" data-ss-thing="direction/third" data-ss-label="Third" data-line="One line on what it leads with." data-ss-x="3200" data-ss-y="0">
  <div class="card-menu no-print" data-ss-canvas="label"><button type="button" class="menu-open" aria-haspopup="menu" aria-expanded="false" aria-label="Menu for Third">⋯</button><div class="menu" role="menu" hidden><button type="button" class="use-this" role="menuitem" data-ss-say="Use Third" title="Use Third"><span class="use">Use this</span><span class="chosen">✓ Chosen</span></button><button type="button" class="round" role="menuitem" data-ss-say="Another round of Third" title="Another round of Third">Another round</button></div></div>
  <!-- part:third --><div class="drawing" data-ss-id="third-drawing"><h2>Third</h2><p>Being drawn…</p><i></i><i></i><i></i></div><!-- /part:third -->
</section>

</div>

<script>
function ssDraw(fn) { fn(); document.addEventListener('ss:live', () => fn()); }
/* switcher: start */
(() => {
const q = (s) => document.querySelector(s), ch = (x) => x.hasAttribute('data-chosen');
const all = () => [...document.querySelectorAll('section.direction:not([data-view-of])')];
const label = (d) => d.dataset.ssLabel || d.dataset.ssId || '';
const byId = (id) => !!id && (document.getElementById(id) || q('[data-ss-id="' + CSS.escape(id) + '"]'));
const dirAt = (at) => at && all().find((d) => d === at || d.contains(at));
const canvas = () => !!q('[data-ss-canvas-area]');
const open = (d) => { history.replaceState(null, '', '#' + encodeURIComponent(d.dataset.ssId)); dispatchEvent(new HashChangeEvent('hashchange')); };
function pick() {
let id = location.hash.slice(1);
try { id = decodeURIComponent(id); } catch {}
const dirs = all();
return dirAt(byId(id)) || dirs.find((d) => d.hasAttribute('data-default')) || dirs[0];
}
function pills() {
document.querySelectorAll('.use-this').forEach((u) => {
const d = all().find((x) => 'Use ' + label(x) === u.dataset.ssSay), on = !!d && ch(d);
u.toggleAttribute('data-chosen', on);
u.disabled = on;
});
}
function frame() {
const c = (window.ss && window.ss.canvas) || {};
const back = q('.frame-back'), bar = q('.switcher'), use = q('.frame-use'), round = q('.frame-round');
if (back) back.hidden = !c.open;
if (bar) bar.toggleAttribute('data-canvas-view', canvas() && !c.open && typeof c.zoom === 'number');
const d = c.open && dirAt(byId(c.open)), on = !!d && all().length > 1;
if (use) {
use.hidden = !on;
if (on) { use.dataset.ssSay = use.title = 'Use ' + label(d); use.toggleAttribute('data-chosen', ch(d)); use.disabled = ch(d); }
}
if (round) { round.hidden = !on; if (on) round.dataset.ssSay = round.title = 'Another round of ' + label(d); }
pills();
}
function show() {
const d = pick(), tabs = q('.switcher-tabs'), line = q('.switcher-line');
all().forEach((x, i) => {
x.classList.toggle('on', x === d);
if (tabs && tabs.children[i]) tabs.children[i].setAttribute('aria-selected', String(x === d));
});
if (line && d && line.textContent !== (d.dataset.line || '')) line.textContent = d.dataset.line || '';
frame();
}
function draw() {
const tabs = q('.switcher-tabs');
if (tabs) tabs.replaceChildren(...all().map((d) => {
const b = document.createElement('button');
b.type = 'button';
b.setAttribute('role', 'tab');
b.textContent = label(d);
if (ch(d)) b.dataset.chosen = '';
b.addEventListener('click', () => open(d));
return b;
}));
show();
}
const stale = () => {
const t = q('.switcher-tabs'), dirs = all();
return !!t && (t.children.length !== dirs.length || dirs.some((d, i) => t.children[i].textContent !== label(d)
|| ch(t.children[i]) !== ch(d)));
};
window.ssFrame = frame;
window.ssShow = show;
window.ssPillOf = (u) => all().find((x) => 'Use ' + label(x) === u.dataset.ssSay);
if (!window.ssSlimHeard) {
window.ssSlimHeard = true;
document.addEventListener('ss:canvas', () => window.ssFrame());
addEventListener('hashchange', () => window.ssShow());
document.addEventListener('click', (e) => {
const t = e.target && e.target.closest ? e.target : null;
if (!t) return;
const b = t.closest('.menu-open');
document.querySelectorAll('.card-menu .menu:not([hidden])').forEach((m) => { if (m.previousElementSibling !== b) { m.hidden = true; m.previousElementSibling.setAttribute('aria-expanded', 'false'); } });
if (b) { const m = b.nextElementSibling; m.hidden = !m.hidden; b.setAttribute('aria-expanded', String(!m.hidden)); m.style.left = b.getBoundingClientRect().right < m.offsetWidth ? '0' : ''; return; }
const u = t.closest('.use-this'), d = u && window.ssPillOf(u);
if (d) open(d);
}, true);
}
// On the bar: Esc goes Back, a tab's number opens its direction.
if (!window.ssSlimKeys) {
window.ssSlimKeys = true;
addEventListener('keydown', (e) => {
const t = e.target, k = e.key, c = window.ss && window.ss.canvas, d = all()[k - 1], b = q('.frame-back');
if (!t.closest || !t.closest('.switcher') || !canvas() || e.metaKey || e.ctrlKey || e.altKey) return;
if (k === 'Escape' && c && c.open && b && t.closest('button,a,summary')) { e.preventDefault(); b.click(); }
else if (/^[1-9]$/.test(k) && d && t.closest('[role=tab]')) { e.preventDefault(); open(d); }
}, true);
}
if (window.ssSlimWatch) window.ssSlimWatch.disconnect();
window.ssSlimWatch = new MutationObserver(() => { if (stale()) draw(); else pills(); });
window.ssSlimWatch.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-ss-label', 'data-line', 'data-ss-id', 'data-chosen'] });
draw();
})();
/* switcher: end */
function ssControls() { return [...document.querySelectorAll('.tweaks input[data-var]')].slice(0, 6); }
function ssStep(i) { return i.dataset.kind === 'switch' || i.dataset.kind === 'choice'; }
function ssMirror() {
const steps = ssControls().filter(ssStep);
if (!steps.length) return;
for (const d of [document.documentElement, ...document.querySelectorAll('section.direction')]) {
const cs = getComputedStyle(d);
for (const i of steps) {
const v = cs.getPropertyValue(i.dataset.var).trim(), a = 'data-' + i.dataset.var.slice(2);
const n = v === '' ? null : String(Math.round(parseFloat(v)) || 0);
if (n === null ? d.hasAttribute(a) : d.getAttribute(a) !== n) n === null ? d.removeAttribute(a) : d.setAttribute(a, n);
}
}
}
(() => {
const shown = () => document.querySelector('section.direction.on') || document.documentElement;
const said = (i) => {
const v = i.type === 'color' ? i.value : String(+i.value), o = i.dataset.options ? i.dataset.options.split('|') : [];
return i.dataset.kind === 'switch' ? (+v ? 'on' : 'off') : i.dataset.kind === 'choice' ? (o[+v] || v) : v + (i.type === 'color' ? '' : i.dataset.unit || '');
};
const name = (i) => (i.closest('label')?.firstChild?.textContent || i.dataset.var).trim();
function wire() {
for (const i of ssControls()) {
if (i.ssWired) continue;
i.ssWired = true;
const out = i.closest('label')?.querySelector('output') || document.createElement('output');
if (!out.isConnected) i.before(out);
const show = () => { const t = said(i); if (out.textContent !== t) out.textContent = t; if (ssStep(i)) i.setAttribute('aria-valuetext', t); };
i.ssRead = () => { const v = getComputedStyle(shown()).getPropertyValue(i.dataset.var).trim(); if (v) i.value = i.type === 'color' ? v : parseFloat(v); show(); };
i.addEventListener('input', () => { shown().style.setProperty(i.dataset.var, i.type === 'color' ? i.value : i.value + (i.dataset.unit || '')); show(); });
i.ssRead();
}
}
const line = () => { const d = shown(), who = d.dataset?.ssLabel ? 'for ' + d.dataset.ssLabel : 'for this page'; return `Keep these ${who}: ` + ssControls().map((i) => `${name(i)} ${said(i)}`).join(', '); };
const keep = () => { const b = document.querySelector('[data-tweaks-keep]'), l = b && line(); if (b && b.dataset.ssSay !== l) { b.dataset.ssSay = l; b.title = l; } return b; };
window.ssKeep = async (e) => {
const b = e.target.closest && e.target.closest('[data-tweaks-keep]');
if (!b || !keep()) return;
if (window.parent !== window) return;
const l = b.dataset.ssSay;
try { await navigator.clipboard.writeText(l); b.textContent = 'Copied: paste it in the chat'; } catch { prompt('Copy this into the chat', l); }
};
if (!window.ssKeepHeard) { window.ssKeepHeard = true; document.addEventListener('click', (e) => window.ssKeep(e), true); }
const again = () => { wire(); ssMirror(); ssControls().forEach((i) => i.ssRead && i.ssRead()); keep(); };
new MutationObserver(again).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
again();
})();
/* questions: start */
(() => {
const card = document.querySelector('.ss-questions'), go = card && card.querySelector('.ss-start');
if (!go) return;
const sent = () => card.dataset.sent !== undefined;
const say = () => 'Start designing with my answers. ' + [...card.querySelectorAll('fieldset')].map((f) => {
const a = [...f.querySelectorAll('input:checked')].map((i) => i.value), t = f.querySelector('input[type="text"]');
if (t && t.value.trim()) a.push(t.value.trim());
return (f.querySelector('legend')?.textContent || '').trim() + ' ' + (a.join(', ') || 'your pick');
}).join(' · ');
// The button stays off until the viewer's title is the line again, so a tap can't only fill the chat box.
const ready = () => { if (!sent()) go.disabled = go.getAttribute('aria-disabled') !== 'true' && go.title !== go.dataset.ssSay; };
const set = () => {
if (sent()) return;
const l = say();
if (go.dataset.ssSay !== l) { go.dataset.ssSay = l; if (go.hasAttribute('data-ss-title')) go.setAttribute('data-ss-title', l); else go.title = l; }
ready();
};
if (!sent()) go.textContent = 'Start designing';
const lock = (on, why) => {
if (on) card.dataset.sent = ''; else delete card.dataset.sent;
card.querySelectorAll('input, .ss-start').forEach((i) => { i.disabled = on; });
let w = card.querySelector('.ss-why');
if (!w) { w = document.createElement('p'); w.className = 'ss-why'; w.setAttribute('role', 'status'); go.before(w); }
w.textContent = why || '';
go.textContent = on ? (window.parent !== window ? 'Designing… the directions come next' : 'Copied: paste it in the chat') : 'Start designing';
};
if (!card.ssWired) {
card.ssWired = true;
card.addEventListener('input', set);
card.addEventListener('change', set);
card.addEventListener('click', (e) => {
if (!e.target.closest || !e.target.closest('.ss-start') || sent()) return;
const l = go.dataset.ssSay;
if (go.getAttribute('aria-disabled') !== 'true' && go.title !== l) { e.stopPropagation(); ready(); return; }
setTimeout(() => {
if (go.getAttribute('aria-disabled') === 'true') { lock(false, go.title || 'Not sent. Try again in a moment.'); return; }
lock(true);
if (window.parent === window) navigator.clipboard?.writeText(l).catch(() => prompt('Copy this into the chat', l));
}, 0);
});
card.addEventListener('ss:say-refused', (e) => {
lock(false, (e.detail && e.detail.why) || 'Not sent. Press Start designing again.');
set();
setTimeout(ready, 1600);
});
if (window.MutationObserver) new window.MutationObserver(ready).observe(go, { attributes: true, attributeFilter: ['title', 'aria-disabled'] });
}
set();
})();
/* questions: end */
</script>
<!-- design: end -->
