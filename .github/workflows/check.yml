# Checks the skill on every pull request, and on every push to main: the same format
# check Spacesheep runs when it takes a release. A folder that fails can't become a version.
name: Check the skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npx -y spacesheep@latest skills lint

      # The page a Shepherd turn copies is what base.html makes.
      - run: node tools/shepherd.js --check

      # fold.js against a stand-in CLI, and check.js on a folder the test makes: no network and no space.
      - run: node --test test/fold.test.js test/check.test.js test/shepherd.test.js
